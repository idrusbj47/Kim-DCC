  m.querySelector('#mx').onclick=()=>m.remove();m.querySelector('#mo').onclick=async()=>{try{await ok(m);m.remove()}catch(e){toast('Gagal: '+(e.message||e))}};return m}

// ---------- masuk: kode akses atau email ----------
function gateView(msg,tab){VIEW='gate';tab=tab||'kode';clearInterval(timer);S=null;J=null;document.querySelector('.rd')?.remove();
  $('#app').innerHTML=`<div class="lg"><div class="lc"><span class="bdg">AUDIT INTERNAL</span><h2>Audit Internal</h2><p>PT Karya Indah Multiguna. Pilih cara masuk.</p>
  <div class="tabs"><button class="jb${tab==='kode'?' on':''}" data-t="kode">Kode Akses</button><button class="jb${tab==='email'?' on':''}" data-t="email">Email</button></div>

  :`<input class="in" id="em" type="email" placeholder="Email" autocomplete="username"><input class="in" id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password"><button class="btn" id="go">Masuk</button>`}

  const er=m=>$('#er').textContent=m;
  if(tab==='kode'){$('#cd').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
    const go=async()=>{const code=$('#cd').value,nm=$('#nm').value.trim(),b=$('#go');er('');
      if(nm.length<3){er('Isi nama Anda terlebih dahulu.');return}if(!/^[A-Z0-9]{6}$/.test(code)){er('Kode akses terdiri dari 6 karakter.');return}
      b.disabled=true;
      try{let {data:{session}}=await sb.auth.getSession();if(session&&!session.user.is_anonymous){await sb.auth.signOut();session=null}
        if(!session){const a=await sb.auth.signInAnonymously();if(a.error)throw new Error(/anonymous/i.test(a.error.message)?'Layanan audit belum diaktifkan. Hubungi admin KIM.':a.error.message)}
        const r=await sb.rpc('ia_redeem',{p_code:code,p_nama:nm});if(r.error)throw r.error;const d=r.data;

        if(error){er(/invalid login/i.test(error.message)?'Email atau kata sandi salah.':'Gagal masuk: '+error.message);b.disabled=false;return}

  const r=await sb.from('ia_jadwal').select('*').eq('id',d.jadwal_id).maybeSingle();if(r.error||!r.data)throw new Error('Jadwal tidak ditemukan');

function fotoCompress(cv){let c=cv,q=.82;
  for(let k=0;k<14;k++){let u=c.toDataURL('image/webp',q);if(!u.startsWith('data:image/webp'))u=c.toDataURL('image/jpeg',q);
    if(u.length*.75<=300*1024)return u;
    if(q>.5)q-=.1;else{const n=document.createElement('canvas');n.width=Math.max(1,Math.round(c.width*.85));n.height=Math.max(1,Math.round(c.height*.85));n.getContext('2d').drawImage(c,0,0,n.width,n.height);c=n;q=.7}}
  const w=c.toDataURL('image/webp',.4);return w.startsWith('data:image/webp')?w:c.toDataURL('image/jpeg',.4)}
function fotoJpg(u){return new Promise((res,rej)=>{const im=new Image();im.onerror=()=>rej(new Error('foto'));im.onload=()=>{const s=Math.min(1,900/im.naturalWidth),w=Math.max(1,Math.round(im.naturalWidth*s)),h=Math.max(1,Math.round(im.naturalHeight*s)),c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);const b=atob(c.toDataURL('image/jpeg',.86).split(',')[1]);res({d:Uint8Array.from(b,ch=>ch.charCodeAt(0)),w,h})};im.src=u})}
function fotoEdit(src,done){const img=new Image();img.onerror=()=>toast('Foto tidak bisa dibuka');
  img.onload=()=>{const MAX=1280,sc=Math.min(1,MAX/Math.max(img.naturalWidth,img.naturalHeight)),W=Math.max(1,Math.round(img.naturalWidth*sc)),H=Math.max(1,Math.round(img.naturalHeight*sc));
    const ov=document.createElement('div');ov.className='fed';
    ov.innerHTML=`<div class="ftb"><div class="ftl"><button type="button" data-t="arrow" class="on">Panah</button><button type="button" data-t="rect">Kotak</button><button type="button" data-t="circle">Lingkaran</button><button type="button" data-t="hl">Stabilo</button></div>
    <div class="ftl"><button type="button" class="sw on" data-c="#e11d48" style="background:#e11d48"></button><button type="button" class="sw" data-c="#facc15" style="background:#facc15"></button><button type="button" class="sw" data-c="#16a34a" style="background:#16a34a"></button><button type="button" class="sw" data-c="#2563eb" style="background:#2563eb"></button><button type="button" data-u>Undo</button><button type="button" data-x>Hapus semua</button></div></div>
    <div class="fcv"><canvas></canvas></div><div class="fab"><button class="btn g" type="button" data-b>Batal</button><button class="btn" type="button" data-s>Simpan foto</button></div>`;
    document.body.append(ov);const cv=ov.querySelector('canvas');cv.width=W;cv.height=H;const x=cv.getContext('2d');
    let tool='arrow',col='#e11d48',sh=[],cur=null;const lw=Math.max(4,Math.round(W/150));
    const shape=s=>{x.save();x.strokeStyle=x.fillStyle=s.c;x.lineCap=x.lineJoin='round';x.lineWidth=lw;
      if(s.t==='hl'){x.globalAlpha=.4;x.lineWidth=lw*5;x.beginPath();s.p.forEach((p,k)=>k?x.lineTo(p[0],p[1]):x.moveTo(p[0],p[1]));if(s.p.length===1)x.lineTo(s.p[0][0]+.1,s.p[0][1]);x.stroke()}
      else if(s.t==='rect'){x.strokeRect(s.a[0],s.a[1],s.b[0]-s.a[0],s.b[1]-s.a[1])}
      else if(s.t==='circle'){x.beginPath();x.ellipse((s.a[0]+s.b[0])/2,(s.a[1]+s.b[1])/2,Math.abs(s.b[0]-s.a[0])/2||1,Math.abs(s.b[1]-s.a[1])/2||1,0,0,Math.PI*2);x.stroke()}
      else{const [x0,y0]=s.a,[x1,y1]=s.b,an=Math.atan2(y1-y0,x1-x0),hl=lw*4.5;x.beginPath();x.moveTo(x0,y0);x.lineTo(x1,y1);x.stroke();
        x.beginPath();x.moveTo(x1,y1);x.lineTo(x1-hl*Math.cos(an-.45),y1-hl*Math.sin(an-.45));x.lineTo(x1-hl*Math.cos(an+.45),y1-hl*Math.sin(an+.45));x.closePath();x.fill()}
      x.restore()};
    const draw=()=>{x.globalAlpha=1;x.drawImage(img,0,0,W,H);sh.forEach(shape);if(cur)shape(cur)};draw();
    const setC=c=>{col=c;ov.querySelectorAll('[data-c]').forEach(b=>b.classList.toggle('on',b.dataset.c===c))};
    const pt=e=>{const b=cv.getBoundingClientRect();return[(e.clientX-b.left)*W/b.width,(e.clientY-b.top)*H/b.height]};
    cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);const p=pt(e);cur=tool==='hl'?{t:'hl',c:col,p:[p]}:{t:tool,c:col,a:p,b:p};draw()});
    cv.addEventListener('pointermove',e=>{if(!cur)return;const p=pt(e);if(cur.t==='hl')cur.p.push(p);else cur.b=p;draw()});
    ['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{if(!cur)return;sh.push(cur);cur=null;draw()}));
    ov.addEventListener('click',e=>{const t=e.target.closest('[data-t]'),c=e.target.closest('[data-c]');
      if(t){tool=t.dataset.t;ov.querySelectorAll('[data-t]').forEach(b=>b.classList.toggle('on',b===t));if(tool==='hl')setC('#facc15');else if(col==='#facc15')setC('#e11d48')}

  img.src=src}
function fotoPick(done){const i=document.createElement('input');i.type='file';i.accept='image/*';

async function clXlsx(){await lib('https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js',()=>window.ExcelJS);
  const h=CL.header,L=CL.rows.filter(clFilled).map(r=>({...r,txt:itemTxt(r)})),NR=Math.max(22,L.length+2),wb=new ExcelJS.Workbook(),
  ws=wb.addWorksheet('CHECKLIST AUDIT',{views:[{showGridLines:false}],pageSetup:{paperSize:14,orientation:'portrait',fitToPage:true,fitToWidth:1,fitToHeight:1,horizontalCentered:true,margins:{left:.4,right:.4,top:.4,bottom:.4,header:.2,footer:.2}}});
  ws.columns=[5,16,9.14,9.14,9.14,9.14,9.14,14,10.6,5.6,6.6,8.1].map(width=>({width}));
  const TN='Times New Roman',T={style:'thin'};
  const cell=(r,c,v,o={})=>{const e=ws.getCell(r,c);e.value=v;e.font={name:TN,size:o.sz||11,bold:!!o.b,color:o.col?{argb:o.col}:undefined};e.alignment={vertical:o.v||'middle',horizontal:o.h||'left',wrapText:o.nw?false:true};return e};
  const mg=(r1,c1,r2,c2)=>ws.mergeCells(r1,c1,r2,c2);
  const edge=(r,c,side,style)=>{const e=ws.getCell(r,c);e.border={...(e.border||{}),[side]:{style}}};
  const grid=(r1,c1,r2,c2)=>{for(let r=r1;r<=r2;r++)for(let c=c1;c<=c2;c++)ws.getCell(r,c).border={top:T,left:T,bottom:T,right:T}};
  const rh=(r,v)=>{ws.getRow(r).height=v};
  [1,2,3].forEach(r=>rh(r,19));rh(4,12);rh(5,21);rh(6,21);rh(7,21);rh(8,7);rh(12,7);
  ws.addImage(wb.addImage({base64:LOGO,extension:'png'}),{tl:{col:.15,row:.3},ext:{width:260,height:Math.round(260*LOGO_H/LOGO_W)}});
  [['No. Dokumen',FORM_NO],['Revisi',FORM_REV],['Tgl. Berlaku',FORM_TGL]].forEach((a,i)=>{const r=1+i;cell(r,8,a[0],{nw:1});mg(r,9,r,12);cell(r,9,': '+a[1],{nw:1})});
  mg(5,1,5,12);cell(5,1,'PT. KARYA INDAH MULTIGUNA',{b:1,sz:13,h:'center'});mg(6,1,6,12);cell(6,1,'DAFTAR PEMERIKSAAN INTERNAL AUDIT',{b:1,sz:13,h:'center'});
  mg(7,1,7,12);cell(7,1,'QUALITY MANAGEMENT SYSTEM',{b:1,sz:12,h:'center'});
  for(let c=1;c<=12;c++){edge(6,c,'bottom','medium');edge(7,c,'bottom','medium')}
  [['Audit Date',dt(h.tgl),'Audit No',h.no],['Audited Dept./Sect',h.dept,'Auditor Name',h.auditor],['Auditee Name',h.auditee,'Dept./Section',h.dept2]].forEach((a,i)=>{const r=9+i;
    mg(r,1,r,2);cell(r,1,a[0],{nw:1});cell(r,3,':',{h:'center'});mg(r,4,r,7);cell(r,4,a[1]||'');cell(r,8,a[2],{nw:1});cell(r,9,':',{h:'center'});mg(r,10,r,12);cell(r,10,a[3]||'');rh(r,19)});
  mg(13,1,14,1);cell(13,1,'No',{h:'center'});mg(13,2,14,2);cell(13,2,'Relevant\nDocument',{h:'center'});mg(13,3,14,8);cell(13,3,'Item Audited / Question',{h:'center'});mg(13,9,14,9);cell(13,9,'Reff.\nClause',{h:'center'});mg(13,10,13,12);cell(13,10,'Finding',{h:'center'});
  ['C','NC','OBS'].forEach((t,i)=>cell(14,10+i,t,{h:'center'}));grid(13,1,14,12);rh(13,18);rh(14,18);
  const lines=(s,w)=>String(s||'').split('\n').reduce((a,p)=>a+Math.max(1,Math.ceil(p.length/w)),0);
  for(let i=0;i<NR;i++){const n=15+i,r=L[i]||{doc:'',q:'',ref:'',f:'',txt:''};mg(n,3,n,8);
    cell(n,1,L[i]?i+1:'',{h:'center'});cell(n,2,r.doc);cell(n,3,r.txt);cell(n,9,r.ref,{h:'center'});
    ['C','NC','OBS'].forEach((t,k)=>cell(n,10+k,r.f===t?'\u221A':'',{b:1,h:'center',sz:12}));grid(n,1,n,12);
    rh(n,Math.max(24,14.5*Math.max(lines(r.txt,60),lines(r.doc,13))+6))}
  const last=14+NR;
  for(let r=1;r<=last;r++){edge(r,1,'left','medium');edge(r,12,'right','medium')}
  for(let c=1;c<=12;c++){edge(1,c,'top','medium');edge(last,c,'bottom','medium')}
  let r=last+2;rh(r,20);cell(r,2,'Remarks :',{nw:1});cell(r,3,'C = Conformity',{nw:1});cell(r,6,'NC = Nonconformity',{nw:1});cell(r,9,'OBS = Observation',{nw:1});
  r+=2;[0,1,2].forEach(i=>rh(r+i,20));
  cell(r,2,'Auditee Sign',{nw:1});cell(r,3,':',{h:'center'});cell(r,8,'Auditor Sign',{nw:1});cell(r,9,':',{h:'center'});
  [[CL.sigE,3],[CL.sigA,9]].forEach(([s,c0])=>{if(!s)return;const ar=s.w/s.h,hh=Math.min(56,125/ar);ws.addImage(wb.addImage({base64:s.img,extension:'png'}),{tl:{col:c0+.1,row:r-1+.1},ext:{width:hh*ar,height:hh}})});
  r+=3;rh(r,19);cell(r,2,'Nama',{nw:1});cell(r,3,':',{h:'center'});mg(r,4,r,7);cell(r,4,CL.sigE?CL.sigE.nama:'');cell(r,8,'Nama',{nw:1});cell(r,9,':',{h:'center'});mg(r,10,r,12);cell(r,10,CL.sigA?CL.sigA.nama:'');
  r++;rh(r,19);cell(r,2,'Date',{nw:1});cell(r,3,':',{h:'center'});mg(r,4,r,7);cell(r,4,sd(CL.sigE));cell(r,8,'Date',{nw:1});cell(r,9,':',{h:'center'});mg(r,10,r,12);cell(r,10,sd(CL.sigA));
  if(!CL.final){r++;cell(r,2,'DRAFT (belum difinalkan)',{sz:9,col:'FFC2255C',nw:1})}
  ws.pageSetup.printArea='A1:L'+r;
  const buf=await wb.xlsx.writeBuffer();return new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}

async function clPdf(){await lib('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js',()=>window.jspdf);
  const {jsPDF}=window.jspdf,PW=609.45,PH=935.43,d=new jsPDF({unit:'pt',format:[PW,PH]}),M=28,TW=PW-2*M,h=CL.header,F='times',FS=11,LH=13.2,MINH=24,MINROWS=22,FOOT=122;
  const L=CL.rows.filter(clFilled).map(r=>({...r,txt:itemTxt(r)}));
  const fr=[.045,.17,.5,.096,.053,.059,.077],cx=[M];fr.forEach(f=>cx.push(cx[cx.length-1]+f*TW));cx[7]=M+TW;
  const ln=(x1,y1,x2,y2,w)=>{d.setLineWidth(w||.6);d.line(x1,y1,x2,y2)},tx=(s,x,y,o)=>d.text(String(s),x,y,o);
  const fit=(s,x,y,mw)=>{let f=FS;d.setFontSize(f);while(d.getTextWidth(s)>mw&&f>9){f-=.5;d.setFontSize(f)}tx(s,x,y);d.setFontSize(FS)};
  const YB=PH-M-FOOT;
  function head(){d.setDrawColor(0);d.setTextColor(0);
    ln(M,M,M+TW,M,1.4);
    const lh=36,lw=lh*LOGO_W/LOGO_H;d.addImage(LOGO,'PNG',M+8,M+9,lw,lh);
    d.setFont(F,'normal');d.setFontSize(FS);const bx=M+TW*.575;
    [['No. Dokumen',FORM_NO],['Revisi',FORM_REV],['Tgl. Berlaku',FORM_TGL]].forEach((a,i)=>{tx(a[0],bx,M+19+i*14);tx(': '+a[1],bx+70,M+19+i*14)});
    d.setFont(F,'bold');d.setFontSize(13);tx('PT. KARYA INDAH MULTIGUNA',PW/2,M+84,{align:'center'});tx('DAFTAR PEMERIKSAAN INTERNAL AUDIT',PW/2,M+100,{align:'center'});
    const top=M+108;ln(M,top,M+TW,top,1.3);d.setFontSize(11.5);tx('QUALITY MANAGEMENT SYSTEM',PW/2,top+14.5,{align:'center'});ln(M,top+20,M+TW,top+20,1.3);
    d.setFont(F,'normal');d.setFontSize(FS);const fy=top+40;
    [['Audit Date',dt(h.tgl),'Audit No',h.no],['Audited Dept./Sect',h.dept,'Auditor Name',h.auditor],['Auditee Name',h.auditee,'Dept./Section',h.dept2]].forEach((a,i)=>{const y=fy+i*17;
      tx(a[0],M+4,y);tx(':',M+TW*.2,y);fit(a[1]||'',M+TW*.2+9,y,TW*.35);tx(a[2],M+TW*.575,y);tx(':',M+TW*.8,y);fit(a[3]||'',M+TW*.8+9,y,TW*.18)});
    const hy=fy+34+12,hh=36;
    ln(cx[0],hy,cx[7],hy);ln(cx[0],hy+hh,cx[7],hy+hh);ln(cx[4],hy+hh/2,cx[7],hy+hh/2);
    [1,2,3,4].forEach(i=>ln(cx[i],hy,cx[i],hy+hh));[5,6].forEach(i=>ln(cx[i],hy+hh/2,cx[i],hy+hh));
    const mid=(a,b)=>(cx[a]+cx[b])/2;
    tx('No',mid(0,1),hy+hh/2+4,{align:'center'});tx('Relevant',mid(1,2),hy+14,{align:'center'});tx('Document',mid(1,2),hy+29,{align:'center'});tx('Item Audited / Question',mid(2,3),hy+hh/2+4,{align:'center'});
    tx('Reff.',mid(3,4),hy+14,{align:'center'});tx('Clause',mid(3,4),hy+29,{align:'center'});tx('Finding',mid(4,7),hy+13,{align:'center'});

    rs.querySelectorAll('canvas').forEach(c=>c.style.width=w);Z=nz;
    rs.scrollLeft=sx*(rs.scrollWidth/sw)-fx;rs.scrollTop=sy*(rs.scrollHeight/sh)-fy;zp.textContent=Math.round(nz*100)+'%'};
  const tk=()=>{raf=0;const df=TZ-Z;if(Math.abs(df)<.002){apply(TZ);return}apply(Z+df*.2);raf=requestAnimationFrame(tk)};
  const zoomTo=(t,x,y)=>{TZ=Math.max(MINZ,Math.min(MAXZ,t));fx=x;fy=y;if(!raf)raf=requestAnimationFrame(tk)};
  const zc=()=>[rs.clientWidth/2,rs.clientHeight/2];
  $('#zi').onclick=()=>zoomTo(TZ*1.25,...zc());$('#zo').onclick=()=>zoomTo(TZ/1.25,...zc());
  r.addEventListener('wheel',e=>{
    if(e.ctrlKey||e.metaKey){e.preventDefault();const b=rs.getBoundingClientRect(),k=Math.abs(e.deltaY)<50?.01:.0022;zoomTo(TZ*Math.exp(-e.deltaY*k),e.clientX-b.left,e.clientY-b.top)}
    else if(e.target===lzc){e.preventDefault();rs.scrollBy(e.deltaX,e.deltaY)}},{passive:false,signal:ac.signal});
  // ----- laser / pointer: coretan hilang dalam 5 detik -----
  const fitLz=()=>{const t=$('.rb').offsetHeight,w=r.clientWidth,h=r.clientHeight-t,s=devicePixelRatio||1;
    lzc.style.top=t+'px';lzc.style.width=w+'px';lzc.style.height=h+'px';lzc.width=w*s;lzc.height=h*s;kick()};
  const loop=()=>{raf2=0;const x=lzc.getContext('2d'),s=devicePixelRatio||1,now=performance.now();
    x.setTransform(s,0,0,s,0,0);x.clearRect(0,0,lzc.width,lzc.height);x.lineCap=x.lineJoin='round';
    cs=cs.map(st=>st.filter(p=>now-p.t<LT)).filter(st=>st.length);
    x.shadowColor='#ff2a2a';x.shadowBlur=10;x.strokeStyle=x.fillStyle='#ff2a2a';x.lineWidth=4;
    for(const st of cs){
      if(st.length===1){x.globalAlpha=Math.max(0,1-(now-st[0].t)/LT);x.beginPath();x.arc(st[0].x,st[0].y,2.5,0,7);x.fill()}
      for(let i=1;i<st.length;i++){x.globalAlpha=Math.max(0,1-(now-st[i].t)/LT);x.beginPath();x.moveTo(st[i-1].x,st[i-1].y);x.lineTo(st[i].x,st[i].y);x.stroke()}}
    if(lzOn&&mx>=0){x.globalAlpha=1;x.shadowBlur=16;x.beginPath();x.arc(mx,my,drawing?7:6,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.beginPath();x.arc(mx,my,2.2,0,7);x.fill()}
    if(cs.length)kick()};
  const kick=()=>{if(!raf2)raf2=requestAnimationFrame(loop)};
  const pt=e=>{const b=lzc.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top,t:performance.now()}};
  const toggleLz=()=>{lzOn=!lzOn;drawing=false;if(!lzOn)mx=-1;lzc.classList.toggle('on',lzOn);$('#lz').classList.toggle('on',lzOn);kick()};
  $('#lz').onclick=toggleLz;
  lzc.addEventListener('pointerdown',e=>{drawing=true;lzc.setPointerCapture(e.pointerId);const p=pt(e);mx=p.x;my=p.y;cs.push([p]);kick()},sg);
  lzc.addEventListener('pointermove',e=>{const p=pt(e);mx=p.x;my=p.y;if(drawing)cs[cs.length-1].push(p);kick()},sg);
  ['pointerup','pointercancel'].forEach(n=>lzc.addEventListener(n,()=>{drawing=false;kick()},sg));
  lzc.addEventListener('pointerleave',()=>{mx=-1;kick()},sg);
  addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
    if(k==='z'||k==='a'){e.preventDefault();const f=e.repeat?1.05:1.25;zoomTo(k==='z'?TZ*f:TZ/f,...zc())}
    else if(k==='l')toggleLz()},sg);
  addEventListener('resize',()=>{[fx,fy]=zc();apply(Z);fitLz()},sg);
  fitLz();
  // ----- halaman -----
  await loadWM();
  const paths=Array.from({length:d.pages},(_,i)=>`${d.id}/${String(i+1).padStart(3,'0')}.webp`);
  const s=await sb.storage.from(BUCKET).createSignedUrls(paths,90);
  if(s.error){close();toast('Akses ditolak. Kode mungkin sudah berakhir.');tick();return}
  const urls=(s.data||[]).map(x=>x.signedUrl);rs.innerHTML='';
  for(let i=0;i<d.pages;i++){
    const c=document.createElement('canvas');c.style.width=base()*Z+'px';rs.append(c);const x=c.getContext('2d');
    try{const bm=await createImageBitmap(await (await fetch(urls[i])).blob());c.width=bm.width;c.height=bm.height;x.drawImage(bm,0,0)}catch{c.width=820;c.height=200;x.fillText('Gagal memuat halaman',20,100)}
    mark(c)}}

// ---------- penghalang (pencegah awam, bukan pengaman mutlak) ----------
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('dragstart',e=>e.preventDefault());
addEventListener('copy',e=>{if(!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))e.preventDefault()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&['s','p','u','c','a'].includes(k)&&!/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)||k==='f12'||k==='printscreen'){e.preventDefault();if(k==='printscreen'){navigator.clipboard?.writeText('');toast('Tangkapan layar dilarang')}}});
const veil=on=>{const r=$('.rd');if(r)r.classList.toggle('veil',on)};
document.addEventListener('visibilitychange',()=>veil(document.hidden));addEventListener('blur',()=>veil(true));addEventListener('focus',()=>veil(false));

// ---------- tombol kembali (HP): mundur per tahap, di beranda tanya dulu ----------
let VIEW='gate',guard=false,asking=false;
async function doLogout(){clearInterval(timer);await clFlush();await sb.auth.signOut();gateView()}
function armBack(){if(guard)return;guard=true;try{history.pushState({ia:1},'')}catch(e){}}
addEventListener('popstate',async()=>{
  if(!guard)return;guard=false;
  if(VIEW==='gate'){history.back();return}
  const m=[...document.querySelectorAll('.mdl,.fed')].pop();
  if(m){m.remove();armBack();return}
  const rd=document.querySelector('.rd');
  if(rd){const c=document.querySelector('#cl');c?c.click():rd.remove();armBack();return}
  if(VIEW==='jadwal'&&S&&S.mode==='email'){await listView();return}
  armBack();if(asking)return;asking=true;
  const ok=confirm('Keluar dari audit internal?');asking=false;
  if(ok)await doLogout()});

// ---------- mulai ----------
(async()=>{
  try{const {data:{session}}=await sb.auth.getSession();
    if(session){
      if(session.user.is_anonymous){const r=await sb.rpc('ia_status');if(r.data&&r.data.ok){await enterKode(r.data);return}}
      else{await enterStaff();return}}}catch(e){}
  gateView()})();
</script><script>
(()=>{
const FW=1500,FH=500; // rasio 3:1

// ---------- helper: tambal fungsi yang sudah ada (ganti potongan kode) ----------
function patch(name,pairs){
  try{
    let s=window[name].toString(),ok=true;
    for(const [a,b] of pairs){if(!s.includes(a)){ok=false;console.warn('[ia-foto-frame] bagian tidak ditemukan di',name,':',a);continue}s=s.replace(a,()=>b)}
    (0,eval)('window.'+name+'='+s);
    return ok;
  }catch(e){console.warn('[ia-foto-frame] gagal menambal',name,e);return false}
}

const st=document.createElement('style');
st.textContent='.fed .fz{flex:1;min-width:140px;width:auto;margin:0;padding:0;border:0;background:transparent}.fed .fcv canvas.frm{cursor:grab;outline:2px dashed #fff;outline-offset:-2px}.fed .fcv canvas.frm:active{cursor:grabbing}.fed .fhint{color:#cbd9f5;font-size:12px;margin-right:auto;align-self:center;line-height:1.4}';
document.head.append(st);

// ---------- editor frame: geser & zoom foto di dalam frame 3:1 ----------
window.fotoFrame=function(src,done){
  const img=new Image();
  img.onerror=()=>toast('Foto tidak bisa dibuka');
  img.onload=()=>{
    const iw=img.naturalWidth,ih=img.naturalHeight,ov=document.createElement('div');ov.className='fed';
    ov.innerHTML='<div class="ftb"><div class="ftl"><b style="color:#fff;font-size:13px">Atur foto di dalam frame</b></div>'
      +'<div class="ftl"><button type="button" data-m="fill">Isi frame</button><button type="button" data-m="fit">Tampil utuh</button><span style="color:#fff;font-size:12px">Zoom</span><input type="range" class="fz" min="0" max="100" value="0"></div></div>'
      +'<div class="fcv"><canvas class="frm" width="'+FW+'" height="'+FH+'"></canvas></div>'
      +'<div class="fab"><span class="fhint">Geser foto dengan jari/mouse. Bagian di dalam frame persis yang masuk laporan.</span><button class="btn g" type="button" data-b>Batal</button><button class="btn" type="button" data-s>Lanjut</button></div>';
    document.body.append(ov);
    const cv=ov.querySelector('canvas'),x=cv.getContext('2d'),z=ov.querySelector('.fz');
    const contain=Math.min(FW/iw,FH/ih),cover=Math.max(FW/iw,FH/ih),lo=contain*.5,hi=Math.max(cover,contain)*4;
    let sc=cover,ox=0,oy=0,dr=null;
    const draw=()=>{x.fillStyle='#fff';x.fillRect(0,0,FW,FH);const w=iw*sc,h=ih*sc;x.drawImage(img,FW/2+ox-w/2,FH/2+oy-h/2,w,h)};
    const sync=()=>{z.value=Math.round(100*Math.log(sc/lo)/Math.log(hi/lo))};
    const setS=v=>{sc=Math.max(lo,Math.min(hi,v));sync();draw()};
    setS(cover);
    z.oninput=()=>{sc=lo*Math.pow(hi/lo,z.value/100);draw()};
    cv.addEventListener('pointerdown',e=>{e.preventDefault();cv.setPointerCapture(e.pointerId);dr={x:e.clientX,y:e.clientY,ox,oy}});
    cv.addEventListener('pointermove',e=>{if(!dr)return;const k=FW/cv.getBoundingClientRect().width;ox=dr.ox+(e.clientX-dr.x)*k;oy=dr.oy+(e.clientY-dr.y)*k;draw()});
    ['pointerup','pointercancel'].forEach(n=>cv.addEventListener(n,()=>{dr=null}));
    cv.addEventListener('wheel',e=>{e.preventDefault();setS(sc*Math.exp(-e.deltaY*.0015))},{passive:false});
    ov.addEventListener('click',e=>{
      const m=e.target.closest('[data-m]');
      if(m){ox=oy=0;setS(m.dataset.m==='fit'?contain:cover);return}
      if(e.target.closest('[data-b]'))ov.remove();
      else if(e.target.closest('[data-s]')){const u=cv.toDataURL('image/jpeg',.92);ov.remove();done(u)}
    });
  };
  img.src=src;
};

// ---------- pilih foto -> frame -> coret/anotasi ----------
window.fotoPick=function(done){
  const i=document.createElement('input');i.type='file';i.accept='image/*';
  i.onchange=()=>{const f=i.files&&i.files[0];if(!f)return;const r=new FileReader();
    r.onload=()=>fotoFrame(r.result,u=>fotoEdit(u,done));
    r.onerror=()=>toast('Foto gagal dibaca');r.readAsDataURL(f)};
  i.click();
};

// editor anotasi: jangan perkecil gambar frame (1500 px)
patch('fotoEdit',[['MAX=1280','MAX=1600']]);

// tombol "Atur frame" di samping "Edit foto"
patch('fotoMount',[
  ['<button type="button" class="btn g bs" data-fe>Edit foto</button>','<button type="button" class="btn g bs" data-fr>Atur frame</button><button type="button" class="btn g bs" data-fe>Edit foto</button>'],
  ["else if(b.hasAttribute('data-fe'))","else if(b.hasAttribute('data-fr'))fotoFrame(get(),u=>fotoEdit(u,v=>{set(v);draw()}));else if(b.hasAttribute('data-fe'))"]
]);

// ---------- foto untuk laporan: selalu dimasukkan ke frame 3:1 (foto tinggi tidak melebar) ----------
window.fotoJpg=function(u){
  return new Promise((res,rej)=>{
    const im=new Image();im.onerror=()=>rej(new Error('foto'));
    im.onload=()=>{
      const c=document.createElement('canvas');c.width=FW;c.height=FH;const x=c.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,FW,FH);
      const s=Math.min(FW/im.naturalWidth,FH/im.naturalHeight),w=im.naturalWidth*s,h=im.naturalHeight*s;
      x.drawImage(im,(FW-w)/2,(FH-h)/2,w,h);
      x.strokeStyle='#8a8a8a';x.lineWidth=4;x.strokeRect(2,2,FW-4,FH-4);
      const b=atob(c.toDataURL('image/jpeg',.9).split(',')[1]);
      res({d:Uint8Array.from(b,ch=>ch.charCodeAt(0)),w:FW,h:FH});
    };
    im.src=u;
  });
};

// ---------- ukuran foto di Word: lebar (maks 540 px), tinggi menyesuaikan sisa ruang halaman ----------
window.IAFZ=function(r){
  const nl=rptLines(r).reduce((a,x)=>a+Math.max(1,Math.ceil(String(x.t||'').length/78)),0),
        hp=Math.max(80,Math.min(135,215-nl*14));        // tinggi foto (pt)
  let h=hp*4/3,w=h*r.foto.w/r.foto.h;                    // ke px
  if(w>540){h*=540/w;w=540}
  return{w:Math.round(w),h:Math.round(h)};
};
patch('laporanDocx',[['const q=Math.min(280/r.foto.w,140/r.foto.h,1);return{w:Math.round(r.foto.w*q),h:Math.round(r.foto.h*q)}','return IAFZ(r)']]);

// ---------- ukuran foto di PDF ----------
patch('laporanPdf',[['Math.min(220/r.foto.w,90/r.foto.h)','Math.min(330/r.foto.w,105/r.foto.h)']]);
})();

</script>

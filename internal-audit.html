<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f4d">
<title>Audit Internal | PT Karya Indah Multiguna</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f1f3d;--mut:#64748b;--line:#e2e8f0;--nav:#0b1f4d;--pri:#0a5bd6;--pri2:#3b8bff;--soft:#eaf1fd}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input{font:inherit;color:inherit}
.btn{border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:800;padding:12px 20px;border-radius:12px;cursor:pointer;font-size:14px;box-shadow:0 6px 16px rgba(10,91,214,.35)}
.btn.g{background:var(--soft);color:var(--pri);box-shadow:none}.btn.bs{padding:8px 14px;font-size:12px}.btn:disabled{opacity:.6}
.lg{position:fixed;inset:0;background:linear-gradient(160deg,var(--nav),#081638);display:grid;place-items:center;z-index:30;padding:20px;overflow:auto}
.lc{background:var(--card);border-radius:24px;padding:30px;width:min(400px,100%)}.lc h2{margin:8px 0 4px}.lc p{margin:0 0 16px;color:var(--mut);font-size:13px;line-height:1.5}
.lc .btn{width:100%;margin-top:4px}
.bdg{display:inline-block;background:var(--soft);color:var(--pri);font-size:11px;font-weight:800;letter-spacing:2px;padding:4px 12px;border-radius:999px}
.cd{width:100%;text-align:center;font-size:28px;font-weight:800;letter-spacing:12px;padding:14px 10px 14px 22px;background:var(--bg);border:1px solid var(--line);border-radius:14px;outline:none;margin-bottom:10px}.cd:focus{border-color:var(--pri)}
.err{color:#d6336c;font-size:12px;min-height:16px;margin:6px 0 10px}
.note{background:#fff7e0;border:1px solid #f3dfa2;color:#7a5b00;border-radius:12px;padding:10px 12px;font-size:12px;line-height:1.5}
.lfr{text-align:center;margin-top:14px}.lk{color:var(--pri);font-weight:700;font-size:13px;text-decoration:none}
.tb{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--nav);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;position:sticky;top:0;z-index:5}
.tb b{display:block;font-size:16px}.tb small{display:block;font-size:11px;color:#9db8ea;letter-spacing:.5px}
.tr{display:flex;align-items:center;gap:10px}.sl{font-size:12px;color:#cbd9f5;font-weight:700}
.wrap{max-width:900px;margin:0 auto;padding:18px 16px calc(40px + env(safe-area-inset-bottom))}
.box{background:var(--card);border-radius:22px;padding:20px;border-top:3px solid var(--pri);box-shadow:0 8px 24px rgba(15,31,61,.06)}
.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.bh h3{margin:0;font-size:17px}.bh span{font-size:12px;color:var(--mut)}
.jf{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;scrollbar-width:none}.jf::-webkit-scrollbar{display:none}
.jb{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:7px 14px;font-weight:800;font-size:13px;cursor:pointer}.jb.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent}
.fl input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:none;margin-bottom:6px}
.grp{background:var(--soft);border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;margin:12px 0 8px;display:flex;justify-content:space-between}
.grp i{font-style:normal;background:var(--nav);color:#fff;border-radius:999px;font-size:12px;padding:1px 10px}
.it{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.th{width:48px;height:58px;border-radius:8px;background:var(--soft);color:var(--pri);display:grid;place-items:center;flex:none;font-weight:800;font-size:12px}
.it b{font-size:14px}.it p{margin:2px 0 6px;font-size:12px;color:var(--mut)}
.tag{display:inline-block;background:var(--pri);color:#fff;font-size:11px;font-weight:800;padding:2px 10px;border-radius:999px;margin-right:6px}.tag.o{background:#e8f0fe;color:var(--pri)}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:14px}
.rd{position:fixed;inset:0;background:#0a1228;z-index:20;display:flex;flex-direction:column}
.rb{display:flex;align-items:center;gap:12px;padding:calc(12px + env(safe-area-inset-top)) 18px 12px;background:var(--nav);color:#fff}.rb b{font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{flex:1;overflow:auto;padding:18px 10px 40px;display:flex;flex-direction:column;align-items:stretch;gap:14px}
.rs canvas{display:block;flex:none;margin:0 auto;height:auto;background:#fff;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.5);pointer-events:none}
.rd.veil .rs{filter:blur(28px)}
.zc{display:flex;align-items:center;gap:6px}.zb{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:10px;min-width:34px;height:34px;font-weight:800;font-size:15px;cursor:pointer;padding:0 10px}.zb.on{background:#ff3b3b}.zl{font-size:12px;min-width:46px;text-align:center}
.lz{position:absolute;left:0;z-index:3;touch-action:none;pointer-events:none}.lz.on{pointer-events:auto;cursor:none}
@media(max-width:820px){.pgs{display:none}}
.toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:40}
@media print{body{display:none!important}}

.in,.f input,.f select,.f textarea,.mdl input,.mdl select,.mdl textarea,.lc .in{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:11px 14px;outline:none;margin:0 0 10px;font-size:14px}
textarea{resize:vertical;min-height:70px}
.mdl label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin:4px 0}
.mdl{position:fixed;inset:0;background:rgba(5,12,30,.6);display:grid;place-items:center;z-index:35;padding:16px}
.mdl .lc{background:var(--card);border-radius:22px;padding:24px;width:min(460px,100%);max-height:92vh;overflow:auto}.mdl .lc h2{margin:0 0 4px}.mdl .lc p{margin:0 0 12px;color:var(--mut);font-size:13px}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs .jb{flex:1}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px;flex-wrap:wrap;background:var(--card)}
.row b{font-size:14px}.row span,.row small{font-size:12px;color:var(--mut)}.bt{display:flex;gap:6px;flex-wrap:wrap}
.bs{padding:7px 12px;font-size:12px;border-radius:10px;box-shadow:none}.btn.r{background:#fde8ee;color:#c2255c;box-shadow:none}.btn.g{background:var(--soft);color:var(--pri);box-shadow:none}
.cdl{font-size:20px;letter-spacing:4px;font-weight:800;color:var(--ink)}
.inf{font-size:13px;line-height:1.6;color:var(--mut);margin:0}.inf b{color:var(--ink)}
.k-Mayor{background:#c2255c}.k-Minor{background:#e8890c}.k-OFI{background:#0a7a4b}
.tm{border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:14px;padding:12px 14px;margin-bottom:8px;background:var(--card);font-size:13px;line-height:1.55}
.tm .h{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}.tm p{margin:4px 0}.tm .m{color:var(--mut);font-size:12px}
.hr{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.mdl .lc .btn{width:auto;margin:0}.mdl #mo,.mdl #mx{min-width:90px}

/* ---- checklist audit ---- */
input,textarea,select{-webkit-user-select:text;user-select:text}
.cgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
@media(max-width:620px){.cgrid{grid-template-columns:1fr}}
.cgrid label,.cr label{display:block;font-size:11px;font-weight:700;color:var(--mut);margin:8px 0 3px}
.cgrid input,.cr input,.cr textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 12px;outline:none;font-size:14px;margin:0}
.cgrid input:focus,.cr input:focus,.cr textarea:focus{border-color:var(--pri)}
.cr textarea{min-height:56px}
.cr{position:relative;display:flex;gap:12px;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:14px;padding:10px 14px 12px 12px;margin-bottom:10px;background:var(--card)}
.cr.fc{border-left-color:#0a7a4b}.cr.fn{border-left-color:#c2255c}.cr.fo{border-left-color:#e8890c}
.cn{flex:none;width:30px;height:30px;border-radius:50%;background:var(--soft);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:13px;margin-top:4px}
.cf{flex:1;min-width:0;padding-right:14px}
.c2{display:grid;grid-template-columns:1fr 1.5fr;gap:10px;align-items:end}
.seg{display:flex;gap:6px}
.seg button{flex:1;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 0;font-weight:800;font-size:13px;cursor:pointer}
.seg button.on[data-v=C]{background:#0a7a4b;color:#fff;border-color:transparent}
.seg button.on[data-v=NC]{background:#c2255c;color:#fff;border-color:transparent}
.seg button.on[data-v=OBS]{background:#e8890c;color:#fff;border-color:transparent}
.seg button:disabled{opacity:.7}
.cx{position:absolute;top:6px;right:8px;border:0;background:none;color:var(--mut);font-size:22px;cursor:pointer;line-height:1;padding:4px 6px}
#ccn,#cst{font-size:12px;color:var(--mut)}
.sgg{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:620px){.sgg{grid-template-columns:1fr}}
.sgb{border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.sgb img{max-width:100%;max-height:90px;display:block;margin:8px auto;background:#fff}
.sgb small{display:block;font-size:12px;color:var(--mut);line-height:1.5}
.sgb .sgph{height:70px;display:grid;place-items:center;color:var(--mut);font-size:12px;border:1px dashed var(--line);border-radius:10px;margin:8px 0}
.spw{border:1.5px dashed var(--pri);border-radius:12px;background:#fff;margin:6px 0 10px}
.spw canvas{display:block;width:100%;height:200px;touch-action:none;cursor:crosshair}
</style></head>
<body><div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script>
const SB_URL='https://jvrcmvazuhbxlktnzwer.supabase.co', SB_KEY='sb_publishable_De5UwPKibjXjQ2dFSbaAgw_jPMluQxS', BUCKET='iso-pages';
// sesi auditor dipisah dari sesi karyawan agar tidak saling menimpa
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{storageKey:'kim-ia-auth',persistSession:true,autoRefreshToken:true}});
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=d=>new Date(d).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)};
const JENIS=[['MM','Manual Mutu'],['PR','Prosedur'],['IK','Instruksi Kerja'],['FM','Formulir'],['LN','Lainnya']];
const jOf=d=>{if(d.jenis&&JENIS.some(j=>j[0]===d.jenis))return d.jenis;const p=String(d.kode||'').split(/[-_ .]/)[0].toUpperCase();return ['MM','PR','IK','FM'].includes(p)?p:'LN'};
const jName=c=>(JENIS.find(j=>j[0]===c)||JENIS[4])[1];
const sortDocs=a=>a.sort((x,y)=>JENIS.findIndex(j=>j[0]===jOf(x))-JENIS.findIndex(j=>j[0]===jOf(y))||String(x.kode).localeCompare(String(y.kode),'id',{numeric:true}));
let DOCS=[],S=null,J=null,TAB='dok',Q='',timer=null,FIND=[],JADS=[];
const KAT=['Mayor','Minor','OFI'],STAT=['Terbuka','Dalam tindakan','Verifikasi','Ditutup'];
const tgl=d=>new Date(d+'T00:00:00').toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'});
const lt=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,16);
const gen=()=>{const a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';return Array.from(crypto.getRandomValues(new Uint8Array(6)),x=>a[x%a.length]).join('')};
const tnm=t=>'TMN-'+String(t.nomor).padStart(3,'0');
const inScope=(d,j)=>d.dept==='Semua'||(d.dept===j.dept&&(!d.bagian||!j.bagian||d.bagian===j.bagian));
const where=j=>esc(j.dept)+(j.bagian?' &rsaquo; '+esc(j.bagian):'');
function modal(h,ok,label){const m=document.createElement('div');m.className='mdl';m.innerHTML=`<div class="lc">${h}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:10px"><button class="btn g" id="mx">Batal</button><button class="btn" id="mo">${label||'Simpan'}</button></div></div>`;document.body.append(m);
  m.querySelector('#mx').onclick=()=>m.remove();m.querySelector('#mo').onclick=async()=>{try{await ok(m);m.remove()}catch(e){toast('Gagal: '+(e.message||e))}};return m}

// ---------- masuk: kode akses atau email ----------
function gateView(msg,tab){tab=tab||'kode';clearInterval(timer);S=null;J=null;document.querySelector('.rd')?.remove();
  $('#app').innerHTML=`<div class="lg"><div class="lc"><span class="bdg">AUDIT INTERNAL</span><h2>Audit Internal</h2><p>PT Karya Indah Multiguna. Pilih cara masuk.</p>
  <div class="tabs"><button class="jb${tab==='kode'?' on':''}" data-t="kode">Kode Akses</button><button class="jb${tab==='email'?' on':''}" data-t="email">Email</button></div>
  ${tab==='kode'?`<input class="in" id="nm" placeholder="Nama Anda (auditor)" maxlength="80" autocomplete="name"><input class="cd" id="cd" maxlength="6" autocapitalize="characters" autocomplete="one-time-code" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;"><button class="btn" id="go">Masuk</button><div class="note" style="margin-top:12px">Kode akses 6 karakter dari admin. Hanya berlaku untuk jadwal audit yang ditentukan.</div>`
  :`<input class="in" id="em" type="email" placeholder="Email" autocomplete="username"><input class="in" id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password"><button class="btn" id="go">Masuk</button>`}
  <div class="err" id="er">${esc(msg||'')}</div><div class="lfr"><a class="lk" href="index.html">&larr; Kembali ke halaman utama</a></div></div></div>`;
  document.querySelectorAll('.tabs .jb').forEach(b=>b.onclick=()=>gateView('',b.dataset.t));
  const er=m=>$('#er').textContent=m;
  if(tab==='kode'){$('#cd').oninput=e=>e.target.value=e.target.value.toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
    const go=async()=>{const code=$('#cd').value,nm=$('#nm').value.trim(),b=$('#go');er('');
      if(nm.length<3){er('Isi nama Anda terlebih dahulu.');return}if(!/^[A-Z0-9]{6}$/.test(code)){er('Kode akses terdiri dari 6 karakter.');return}
      b.disabled=true;
      try{let {data:{session}}=await sb.auth.getSession();if(session&&!session.user.is_anonymous){await sb.auth.signOut();session=null}
        if(!session){const a=await sb.auth.signInAnonymously();if(a.error)throw new Error(/anonymous/i.test(a.error.message)?'Layanan audit belum diaktifkan. Hubungi admin KIM.':a.error.message)}
        const r=await sb.rpc('ia_redeem',{p_code:code,p_nama:nm});if(r.error)throw r.error;const d=r.data;
        if(!d||!d.ok){er(d&&d.reason==='limit'?'Terlalu banyak percobaan salah. Coba lagi beberapa menit lagi.':'Kode salah atau sudah kedaluwarsa. Minta kode baru ke admin.');b.disabled=false;return}
        await enterKode(d)}catch(e){er('Gagal: '+(e.message||e));b.disabled=false}};
    $('#go').onclick=go;['#cd','#nm'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')go()}));$('#nm').focus()}
  else{const go=async()=>{const b=$('#go');er('');b.disabled=true;
      try{const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
        if(error){er(/invalid login/i.test(error.message)?'Email atau kata sandi salah.':'Gagal masuk: '+error.message);b.disabled=false;return}
        await enterStaff()}catch(e){er('Gagal: '+(e.message||e));b.disabled=false}};
    $('#go').onclick=go;['#em','#pw'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')go()}));$('#em').focus()}}
async function enterKode(d){
  const r=await sb.from('ia_jadwal').select('*').eq('id',d.jadwal_id).maybeSingle();if(r.error||!r.data)throw new Error('Jadwal tidak ditemukan');
  S={mode:'kode',nama:d.nama,label:d.nama,exp:new Date(d.exp).getTime(),admin:false};J=r.data;await loadDocs();clearInterval(timer);timer=setInterval(tick,30000);jadwalView()}
async function enterStaff(){
  const {data:{session}}=await sb.auth.getSession();
  const p=await sb.from('iso_profiles').select('*').eq('id',session.user.id).maybeSingle();
  if(!p.data){await sb.auth.signOut();gateView('Akun ini belum terdaftar sebagai karyawan KIM.','email');return}
  S={mode:'email',nama:p.data.nama||session.user.email,label:p.data.nama||session.user.email,admin:p.data.role==='admin'};await loadDocs();await listView()}
const tick=()=>{if(S&&S.mode==='kode'&&Date.now()>=S.exp){toast('Kode akses sudah berakhir');gateView('Kode akses sudah berakhir. Minta kode baru ke admin.')}};
async function loadDocs(){const r=await sb.from('iso_documents').select('*').order('kode');if(r.error)throw r.error;DOCS=r.data||[]}
const hdr=(t,back)=>`<header class="tb"><div><b>${t}</b><small>${esc(S.nama)} &middot; ${S.mode==='kode'?'Akses kode':S.admin?'Admin':'Karyawan'}</small></div><div class="tr" style="display:flex;gap:8px;align-items:center">${back?'<button class="btn g bs" id="bk">&larr; Jadwal</button>':''}<button class="btn g bs" id="lo">Keluar</button></div></header>`;
function bindHdr(){const lo=$('#lo');lo.onclick=async()=>{if(confirm('Keluar dari audit internal?')){clearInterval(timer);await clFlush();await sb.auth.signOut();gateView()}};const bk=$('#bk');if(bk)bk.onclick=listView}

// ---------- daftar jadwal (login email) ----------
async function listView(){clearInterval(timer);await clFlush();J=null;TAB='dok';
  const r=await sb.from('ia_jadwal').select('*').order('tanggal',{ascending:false});JADS=r.data||[];
  const card=j=>`<div class="row"><div style="flex:1;min-width:0"><b>${where(j)}</b><br><span>${tgl(j.tanggal)} &middot; Auditor: ${esc(j.auditor||'-')}</span>${S.admin&&j.kode?`<br><span>Kode: <b class="cdl">${esc(j.kode)}</b> sampai ${fmt(j.kode_exp)}</span>`:''}</div><div class="bt"><button class="btn bs" data-o="${j.id}">Buka</button>${S.admin?`<button class="btn g bs" data-k="${j.id}">Kode</button><button class="btn g bs" data-e="${j.id}">Ubah</button><button class="btn r bs" data-x="${j.id}">Hapus</button>`:''}</div></div>`;
  $('#app').innerHTML=hdr('Jadwal Audit Internal')+`<main class="wrap"><div class="box"><div class="bh"><h3>Jadwal</h3>${S.admin?'<button class="btn bs" id="nj">+ Jadwal Baru</button>':''}</div>${JADS.map(card).join('')||'<div class="empty">Belum ada jadwal audit.</div>'}</div></main>`;bindHdr();
  const by=id=>JADS.find(j=>j.id===id);
  document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>{J=by(b.dataset.o);jadwalView()});
  if(!S.admin)return;
  $('#nj').onclick=()=>jadwalForm(null);
  document.querySelectorAll('[data-e]').forEach(b=>b.onclick=()=>jadwalForm(by(b.dataset.e)));
  document.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>kodeForm(by(b.dataset.k)));
  document.querySelectorAll('[data-x]').forEach(b=>b.onclick=async()=>{if(!confirm('Hapus jadwal ini beserta semua temuannya?'))return;
    const x=await sb.from('ia_jadwal').delete().eq('id',b.dataset.x);if(x.error){toast('Gagal: '+x.error.message);return}toast('Jadwal dihapus');listView()})}
function jadwalForm(j){const v=j||{};const dl=a=>`<datalist id="${a[0]}">${[...new Set(a[1].filter(Boolean))].sort().map(x=>`<option value="${esc(x)}">`).join('')}</datalist>`;
  modal(`<h2>${j?'Ubah':'Jadwal'} Audit</h2><p>Tentukan departemen dan bagian yang diaudit. Dokumen yang terbuka menyesuaikan otomatis.</p>

const FORM_NO='KIM-FM-QAD-018',FORM_REV='02',FORM_TGL='01-01-2021';
const libs={};
const lib=(src,ok)=>libs[src]||(libs[src]=new Promise((res,rej)=>{if(ok())return res();const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=()=>{delete libs[src];rej(new Error('Pustaka ekspor gagal dimuat, cek koneksi internet'))};document.head.append(s)}));
let CL=null,clTimer=null,clOff=false;
const clBlank=n=>Array.from({length:n},()=>({doc:'',q:'',ref:'',f:'',note:''}));
const clNew=()=>{const dp=[J.dept,J.bagian].filter(Boolean).join(' > ');return{header:{tgl:J.tanggal||'',no:'',dept:dp,auditor:J.auditor||(S&&S.nama)||'',auditee:'',dept2:dp},rows:clBlank(15),sigE:null,sigA:null,final:false}};

const clLs=v=>{try{localStorage.setItem('kim-ia-cl-'+CL.jid,JSON.stringify(v))}catch{}};
const clSt=t=>{const e=document.querySelector('#cst');if(e)e.textContent=t};
const dt=s=>s?tgl(s):'';
const sd=s=>s?new Date(s.at).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'';
const dl=(blob,name)=>{const u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),6e4)};
const clName=ext=>'Checklist-Audit_'+String([CL.header.dept||'dept',CL.header.tgl||''].join('_')).replace(/[^A-Za-z0-9]+/g,'-').replace(/^-|-$/g,'')+'.'+ext;

async function clLoad(){
  const jid=J.id;let loc=null,srv=null;clOff=false;
  try{loc=JSON.parse(localStorage.getItem('kim-ia-cl-'+jid)||'null')}catch{}
  try{const r=await sb.from('ia_checklist').select('*').eq('jadwal_id',jid).maybeSingle();if(r.error)clOff=true;else srv=r.data}catch(e){clOff=true}
  if(loc&&(loc.dirty||!srv))CL=loc;
  else if(srv)CL={header:srv.header,rows:srv.butir,sigE:srv.sig_auditee,sigA:srv.sig_auditor,final:!!srv.final};
  else CL=clNew();
  CL.jid=jid;if(!CL.rows||!CL.rows.length)CL.rows=clBlank(15);
  if(clOff&&!CL.dirty&&!loc)CL.dirty=false}
const clBody=()=>({jadwal_id:CL.jid,header:CL.header,butir:CL.rows,sig_auditee:CL.sigE,sig_auditor:CL.sigA,final:CL.final,updated_by:S?S.nama:null,updated_at:new Date().toISOString()});
async function clSave(){clTimer=null;if(!CL)return false;const snap=JSON.stringify(CL);
  try{const r=await sb.from('ia_checklist').upsert(clBody(),{onConflict:'jadwal_id'});if(r.error)throw r.error;
    if(JSON.stringify(CL)===snap){CL.dirty=false;clLs(CL)}
    clSt('Tersimpan '+new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'}));return true}
  catch(e){clLs(CL);clSt('Tersimpan di perangkat ini (belum ke server)');return false}}
function clDirty(){CL.dirty=true;clLs(CL);clSt('Menyimpan...');clearTimeout(clTimer);clTimer=setTimeout(clSave,900)}
async function clFlush(){if(clTimer){clearTimeout(clTimer);await clSave()}}
addEventListener('pagehide',()=>{if(clTimer)clSave()});

async function checklistTab(){const ct=$('#ct');ct.innerHTML='<div class="empty">Memuat checklist...</div>';

  clRender();if(CL.dirty&&!clOff)clSave()}
const fnm={C:'fc',NC:'fn',OBS:'fo'};
function rowHtml(r,i){const ro=CL.final?' disabled':'',f=r.f,showN=f==='NC'||f==='OBS'||r.note;
  return `<div class="cr ${fnm[f]||''}" data-i="${i}"><div class="cn">${i+1}</div><div class="cf">
  <label>Relevant Document</label><input data-k="doc" list="cdocs" value="${esc(r.doc)}"${ro} placeholder="Kode / nama dokumen terkait">
  <label>Item Audited / Question</label><textarea data-k="q" rows="2"${ro} placeholder="Butir atau pertanyaan yang diperiksa">${esc(r.q)}</textarea>

  ${showN?`<label>Keterangan temuan / bukti objektif</label><textarea data-k="note" rows="2"${ro} placeholder="Uraikan temuan dan bukti objektif">${esc(r.note)}</textarea>`:''}

  </div>${CL.final?'':'<button type="button" class="cx" data-del title="Hapus butir">&times;</button>'}</div>`}
function clCnt(){const n={C:0,NC:0,OBS:0,x:0};CL.rows.forEach(r=>{if(r.f)n[r.f]++;else if(clFilled(r))n.x++});const e=$('#ccn');if(e)e.innerHTML=`C <b>${n.C}</b> &middot; NC <b>${n.NC}</b> &middot; OBS <b>${n.OBS}</b>${n.x?` &middot; belum dinilai <b>${n.x}</b>`:''}`}
function clRender(){const ct=$('#ct'),h=CL.header,ro=CL.final?' disabled':'';
  const hf=(k,l,t)=>`<div><label>${l}</label><input data-h="${k}" type="${t||'text'}" value="${esc(h[k])}"${ro}></div>`;
  ct.innerHTML=`<div class="bh"><h3>Checklist Audit</h3><span id="cst"></span></div>

  ${clOff?'<div class="note" style="margin:8px 0">Tabel server <b>ia_checklist</b> belum ada, jadi isian baru tersimpan di perangkat ini saja. Jalankan <b>ia_checklist.sql</b> di Supabase agar tersimpan di server dan bisa dibuka dari HP/komputer lain.</div>':''}
  ${CL.final?`<div class="note" style="margin:8px 0">Checklist sudah difinalkan, isian terkunci.${S.admin?' <button class="btn g bs" id="cun" type="button" style="margin-left:6px">Buka kunci</button>':''}</div>`:''}
  <div class="cgrid">${hf('tgl','Audit Date','date')}${hf('no','Audit No')}${hf('dept','Audited Dept./Sect')}${hf('auditor','Auditor Name')}${hf('auditee','Auditee Name')}${hf('dept2','Dept./Section (auditee)')}</div>
  <div class="bh" style="margin-top:16px"><h3 style="font-size:15px">Butir Pemeriksaan</h3><span id="ccn"></span></div>
  <div id="crows">${CL.rows.map(rowHtml).join('')}</div>${CL.final?'':'<button class="btn g bs" id="cadd" type="button">+ Tambah Butir</button>'}
  <div class="bh" style="margin-top:18px"><h3 style="font-size:15px">Tanda Tangan</h3></div><div class="sgg" id="csg"></div>
  <div class="bh" style="margin-top:18px;margin-bottom:6px"><h3 style="font-size:15px">Ekspor</h3></div>
  <div class="hr" style="margin-top:0"><button class="btn bs" id="cxl" type="button">Unduh Excel</button><button class="btn bs" id="cpd" type="button">Unduh PDF</button>${CL.final?'':'<button class="btn g bs" id="cfn" type="button">Finalkan &amp; Kunci</button>'}</div>
  <datalist id="cdocs">${DOCS.filter(d=>inScope(d,J)).map(d=>`<option value="${esc(d.kode)}">${esc(d.judul)}</option>`).join('')}</datalist>`;
  ct.querySelectorAll('[data-h]').forEach(i=>i.oninput=()=>{CL.header[i.dataset.h]=i.value;clDirty()});

  rw.onclick=e=>{const c=e.target.closest('.cr');if(!c)return;const i=+c.dataset.i,r=CL.rows[i],b=e.target.closest('[data-v]');
    if(b&&!CL.final){r.f=r.f===b.dataset.v?'':b.dataset.v;clDirty();c.outerHTML=rowHtml(r,i);clCnt();return}
    if(e.target.closest('[data-del]')){if(clFilled(r)&&!confirm('Hapus butir '+(i+1)+'?'))return;CL.rows.splice(i,1);if(!CL.rows.length)CL.rows=clBlank(1);clDirty();rw.innerHTML=CL.rows.map(rowHtml).join('');clCnt();return}
    if(e.target.closest('[data-tm]'))clTemuan(i)};

  const run=(id,fnc,ext,msg)=>{$(id).onclick=async e=>{const b=e.currentTarget;b.disabled=true;try{await clFlush();dl(await fnc(),clName(ext));toast(msg)}catch(x){toast('Gagal: '+(x.message||x))}b.disabled=false}};

function clSig(){
  const box=(w,k,l)=>{const s=CL[k];return `<div class="sgb"><b>${l} Sign</b>${s?`<img src="${s.img}" alt="tanda tangan ${l}"><small>${esc(s.nama)}<br>${fmt(s.at)}</small>${CL.final?'':`<div class="hr" style="justify-content:center"><button class="btn g bs" data-sg="${w}" type="button">Ulangi</button><button class="btn r bs" data-sx="${w}" type="button">Hapus</button></div>`}`:`<div class="sgph">Belum ditandatangani</div>${CL.final?'':`<button class="btn bs" data-sg="${w}" type="button">Tanda tangan</button>`}`}</div>`};
  const g=$('#csg');g.innerHTML=box('E','sigE','Auditee')+box('A','sigA','Auditor');
  g.querySelectorAll('[data-sg]').forEach(b=>b.onclick=()=>clSign(b.dataset.sg));

function clSign(w){const k=w==='E'?'sigE':'sigA',lab=w==='E'?'Auditee':'Auditor',nm=(CL[k]&&CL[k].nama)||(w==='E'?CL.header.auditee:CL.header.auditor)||'';
  let st={n:0,x0:1e9,y0:1e9,x1:-1,y1:-1},c,x,dpr;

// ---------- ekspor PDF (F4, satu halaman, mengikuti KIM-FM-QAD-018) ----------
async function clPdf(){await lib('https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js',()=>window.jspdf);
  const {jsPDF}=window.jspdf,PW=609.45,PH=935.43,d=new jsPDF({unit:'pt',format:[PW,PH]}),M=28,TW=PW-2*M,h=CL.header,F='times';
  const L=CL.rows.filter(clFilled).map(r=>({...r,txt:itemTxt(r)}));
  const fr=[.045,.145,.525,.096,.053,.059,.078],cx=[M];fr.forEach(f=>cx.push(cx[cx.length-1]+f*TW));cx[7]=M+TW;
  const ln=(x1,y1,x2,y2,w)=>{d.setLineWidth(w||.6);d.line(x1,y1,x2,y2)},tx=(s,x,y,o)=>d.text(String(s),x,y,o);
  const fit=(s,x,y,mw,fs)=>{let f=fs;d.setFontSize(f);while(d.getTextWidth(s)>mw&&f>5){f-=.5;d.setFontSize(f)}tx(s,x,y);d.setFontSize(fs)};
  const FOOT=104,YB=PH-M-FOOT,MINH=17;
  function head(){d.setDrawColor(0);d.setTextColor(0);
    const lh=30,lw=lh*LOGO_W/LOGO_H;d.addImage(LOGO,'PNG',M,M,lw,lh);
    d.setFont(F,'normal');d.setFontSize(8.5);const bx=M+TW*.56;
    [['No. Dokumen',FORM_NO],['Revisi',FORM_REV],['Tgl. Berlaku',FORM_TGL]].forEach((a,i)=>{tx(a[0],bx,M+9+i*11);tx(': '+a[1],bx+62,M+9+i*11)});
    d.setFont(F,'bold');d.setFontSize(10);tx('PT. KARYA INDAH MULTIGUNA',PW/2,M+62,{align:'center'});tx('DAFTAR PEMERIKSAAN INTERNAL AUDIT',PW/2,M+74,{align:'center'});
    const top=M+80;ln(M,top,M+TW,top,1.3);d.setFontSize(9);tx('QUALITY MANAGEMENT SYSTEM',PW/2,top+12,{align:'center'});ln(M,top+17,M+TW,top+17,.8);
    d.setFont(F,'normal');const fy=top+33;
    [['Audit Date',dt(h.tgl),'Audit No',h.no],['Audited Dept./Sect',h.dept,'Auditor Name',h.auditor],['Auditee Name',h.auditee,'Dept./Section',h.dept2]].forEach((a,i)=>{const y=fy+i*13;
      d.setFontSize(8.5);tx(a[0],M+4,y);tx(':',M+TW*.2,y);fit(a[1]||'',M+TW*.2+8,y,TW*.34,8.5);tx(a[2],M+TW*.57,y);tx(':',M+TW*.79,y);fit(a[3]||'',M+TW*.79+8,y,TW*.2,8.5)});
    const hy=fy+3*13+6,hh=26;d.setFontSize(8.5);
    ln(cx[0],hy,cx[7],hy);ln(cx[0],hy+hh,cx[7],hy+hh);ln(cx[4],hy+hh/2,cx[7],hy+hh/2);
    [1,2,3,4].forEach(i=>ln(cx[i],hy,cx[i],hy+hh));[5,6].forEach(i=>ln(cx[i],hy+hh/2,cx[i],hy+hh));
    const mid=(a,b)=>(cx[a]+cx[b])/2,cy=hy+hh/2+3;
    tx('No',mid(0,1),cy,{align:'center'});tx('Relevant',mid(1,2),hy+10,{align:'center'});tx('Document',mid(1,2),hy+21,{align:'center'});tx('Item Audited / Question',mid(2,3),cy,{align:'center'});
    tx('Reff.',mid(3,4),hy+10,{align:'center'});tx('Clause',mid(3,4),hy+21,{align:'center'});tx('Finding',mid(4,7),hy+10,{align:'center'});
    ['C','NC','OBS'].forEach((t,i)=>tx(t,mid(4+i,5+i),hy+hh-3.5,{align:'center'}));
    return{top,y0:hy+hh}}
  // tata letak: kecilkan huruf sampai muat 1 halaman
  let H0;{d.setFont(F,'normal');}
  const lay=fs=>{d.setFont(F,'normal');d.setFontSize(fs);const lhh=fs*1.18;
    return L.map(r=>{const a=d.splitTextToSize(r.doc||'',cx[2]-cx[1]-6),b=d.splitTextToSize(r.txt||'',cx[3]-cx[2]-6),n=Math.max(a.length,b.length,1);return{r,a,b,hgt:Math.max(MINH,n*lhh+5),lhh}})};
  let fs=8.5,cap,items;
  const sim=(its,cp)=>{let pg=1,u=0;its.forEach(i=>{if(u+i.hgt>cp){pg++;u=0}u+=i.hgt});return pg};
  const hd0=(()=>{d.setPage(1);return head()})();cap=YB-hd0.y0;
  for(;fs>=5.5;fs-=.5){items=lay(fs);if(sim(items,cap)===1)break}
  if(fs<5.5){fs=7;items=lay(fs)}
  // bagi ke halaman
  const pages=[[]];let u=0;items.forEach(i=>{if(u+i.hgt>cap&&pages[pages.length-1].length){pages.push([]);u=0}pages[pages.length-1].push(i);u+=i.hgt});
  let no=0;
  pages.forEach((pg,pi)=>{let hd;if(pi===0)hd=hd0;else{d.addPage();hd=head()}
    let y=hd.y0;d.setFont(F,'normal');
    const rowsDraw=[];pg.forEach(i=>rowsDraw.push({i,hgt:i.hgt}));
    let used=pg.reduce((s,i)=>s+i.hgt,0),left=YB-hd.y0-used;
    const nb=Math.max(0,Math.floor(left/MINH));let extra=left-nb*MINH;
    for(let k=0;k<nb;k++)rowsDraw.push({i:null,hgt:MINH+(k===nb-1?extra:0)});
    if(!nb&&rowsDraw.length)rowsDraw[rowsDraw.length-1].hgt+=left;
    rowsDraw.forEach(rw=>{const it=rw.i;
      if(it){no++;d.setFont(F,'normal');d.setFontSize(fs);const r=it.r,cy=y+rw.hgt/2;
        tx(no,(cx[0]+cx[1])/2,cy+fs*.35,{align:'center'});
        const oy=(n)=>y+(rw.hgt-n*it.lhh)/2+fs*.85;
        it.a.forEach((s,k)=>tx(s,cx[1]+3,oy(it.a.length)+k*it.lhh));
        it.b.forEach((s,k)=>tx(s,cx[2]+3,oy(it.b.length)+k*it.lhh));
        tx(r.ref||'',(cx[3]+cx[4])/2,cy+fs*.35,{align:'center',maxWidth:cx[4]-cx[3]-4});
        ['C','NC','OBS'].forEach((t,k)=>{if(r.f===t){const mx=(cx[4+k]+cx[5+k])/2;d.setDrawColor(0);d.setLineWidth(1.2);d.line(mx-4,cy,mx-1,cy+3.5);d.line(mx-1,cy+3.5,mx+5,cy-4)}})}
      y+=rw.hgt;ln(cx[0],y,cx[7],y,.5)});
    for(let i=1;i<=6;i++)ln(cx[i],hd.y0,cx[i],y,.5);
    ln(cx[0],hd.top,cx[0],y,1.3);ln(cx[7],hd.top,cx[7],y,1.3);ln(cx[0],y,cx[7],y,1.3);
    // remarks + tanda tangan
    d.setFont(F,'normal');d.setFontSize(8.5);d.setTextColor(0);const fy=y+16;
    tx('Remarks :',M+TW*.045,fy);tx('C = Conformity',M+TW*.15,fy);tx('NC = Nonconformity',M+TW*.43,fy);tx('OBS = Observation',M+TW*.7,fy);
    if(pi===pages.length-1){
      const sy=fy+22;
      [[CL.sigE,'Auditee Sign',.045,.15,.17],[CL.sigA,'Auditor Sign',.57,.68,.70]].forEach(([s,lb,lx,cxn,ix])=>{
        tx(lb,M+TW*lx,sy+14);tx(':',M+TW*cxn,sy+14);
        if(s){const ar=s.w/s.h,bh=Math.min(38,(TW*.28)/ar),bw=bh*ar;d.addImage(s.img,'PNG',M+TW*ix,sy+(40-bh)/2-4,bw,bh)}
        tx('Nama',M+TW*lx,sy+46);tx(':',M+TW*cxn,sy+46);tx(s?s.nama:'',M+TW*ix,sy+46);
        tx('Date',M+TW*lx,sy+58);tx(':',M+TW*cxn,sy+58);tx(sd(s),M+TW*ix,sy+58)})}
    d.setFontSize(7);d.setTextColor(120);
    if(!CL.final)tx('DRAFT (belum difinalkan)',M,PH-14);
    if(pages.length>1)tx('Hal. '+(pi+1)+'/'+pages.length,PW-M,PH-14,{align:'right'});d.setTextColor(0)});
  return d.output('blob')}
// ---------- pengaturan watermark (diatur admin di index.html > Kelola) ----------
let WM={opacity:.07,thickness:0};
async function loadWM(){try{const r=await sb.from('iso_settings').select('value').eq('key','watermark').maybeSingle();if(r.data&&r.data.value)WM={...WM,...r.data.value}}catch{}}
// ---------- pembaca ----------
function mark(c){const x=c.getContext('2d'),o=WM;x.save();x.globalAlpha=o.opacity;x.fillStyle=x.strokeStyle='#0a3a8a';x.font=`700 ${Math.round(c.width/34)}px sans-serif`;x.rotate(-0.5);
  x.lineJoin='round';x.lineWidth=o.thickness*c.width/2500;
  const t=`AUDITOR \u2022 ${S.label} \u2022 ${fmt(Date.now())}`,put=(a,b)=>{x.fillText(t,a,b);if(o.thickness>0)x.strokeText(t,a,b)};
  for(let y=-c.height;y<c.height*1.5;y+=c.width/6)for(let xx=-c.width;xx<c.width*1.5;xx+=c.width/1.6)put(xx+(y/(c.width/6)%2)*c.width/4,y);x.restore()}
async function openDoc(d){
  if(!d)return;const r=document.createElement('div');r.className='rd';
  r.innerHTML=`<div class="rb"><button class="btn g bs" id="cl">Tutup</button><b>${esc(d.kode)} &middot; ${esc(d.judul)}</b><span class="zc"><button class="zb" id="zo" title="Perkecil (A)">&minus;</button><span class="zl" id="zp">100%</span><button class="zb" id="zi" title="Perbesar (Z)">+</button><button class="zb" id="lz" title="Laser / pointer (L)">Laser</button></span><span class="pgs" style="font-size:12px">${d.pages} hal.</span></div><div class="rs" id="rs"><div class="empty" style="color:#9db8ea">Memuat halaman...</div></div><canvas class="lz" id="lzc"></canvas>`;
  document.body.append(r);
  const rs=$('#rs'),zp=$('#zp'),lzc=$('#lzc'),ac=new AbortController(),sg={signal:ac.signal};
  let Z=1,TZ=1,fx=0,fy=0,raf=0,raf2=0,cs=[],lzOn=false,drawing=false,mx=-1,my=-1;
  const MINZ=.5,MAXZ=4,LT=5000;
  const close=()=>{ac.abort();cancelAnimationFrame(raf);cancelAnimationFrame(raf2);r.remove()};
  $('#cl').onclick=close;
  // ----- zoom halus (Z / A, Ctrl + scroll, tombol + / -) -----
  const base=()=>Math.max(200,Math.min(820,rs.clientWidth-20));
  const apply=nz=>{const sh=rs.scrollHeight,sw=rs.scrollWidth,sx=rs.scrollLeft+fx,sy=rs.scrollTop+fy,w=base()*nz+'px';
    rs.querySelectorAll('canvas').forEach(c=>c.style.width=w);Z=nz;
    rs.scrollLeft=sx*(rs.scrollWidth/sw)-fx;rs.scrollTop=sy*(rs.scrollHeight/sh)-fy;zp.textContent=Math.round(nz*100)+'%'};
  const tk=()=>{raf=0;const df=TZ-Z;if(Math.abs(df)<.002){apply(TZ);return}apply(Z+df*.2);raf=requestAnimationFrame(tk)};
  const zoomTo=(t,x,y)=>{TZ=Math.max(MINZ,Math.min(MAXZ,t));fx=x;fy=y;if(!raf)raf=requestAnimationFrame(tk)};
  const zc=()=>[rs.clientWidth/2,rs.clientHeight/2];
  $('#zi').onclick=()=>zoomTo(TZ*1.25,...zc());$('#zo').onclick=()=>zoomTo(TZ/1.25,...zc());
  r.addEventListener('wheel',e=>{
    if(e.ctrlKey||e.metaKey){e.preventDefault();const b=rs.getBoundingClientRect(),k=Math.abs(e.deltaY)<50?.01:.0022;zoomTo(TZ*Math.exp(-e.deltaY*k),e.clientX-b.left,e.clientY-b.top)}
    else if(e.target===lzc){e.preventDefault();rs.scrollBy(e.deltaX,e.deltaY)}},{passive:false,signal:ac.signal});
  // ----- laser / pointer: coretan hilang dalam 5 detik -----
  const fitLz=()=>{const t=$('.rb').offsetHeight,w=r.clientWidth,h=r.clientHeight-t,s=devicePixelRatio||1;
    lzc.style.top=t+'px';lzc.style.width=w+'px';lzc.style.height=h+'px';lzc.width=w*s;lzc.height=h*s;kick()};
  const loop=()=>{raf2=0;const x=lzc.getContext('2d'),s=devicePixelRatio||1,now=performance.now();
    x.setTransform(s,0,0,s,0,0);x.clearRect(0,0,lzc.width,lzc.height);x.lineCap=x.lineJoin='round';
    cs=cs.map(st=>st.filter(p=>now-p.t<LT)).filter(st=>st.length);
    x.shadowColor='#ff2a2a';x.shadowBlur=10;x.strokeStyle=x.fillStyle='#ff2a2a';x.lineWidth=4;
    for(const st of cs){
      if(st.length===1){x.globalAlpha=Math.max(0,1-(now-st[0].t)/LT);x.beginPath();x.arc(st[0].x,st[0].y,2.5,0,7);x.fill()}
      for(let i=1;i<st.length;i++){x.globalAlpha=Math.max(0,1-(now-st[i].t)/LT);x.beginPath();x.moveTo(st[i-1].x,st[i-1].y);x.lineTo(st[i].x,st[i].y);x.stroke()}}
    if(lzOn&&mx>=0){x.globalAlpha=1;x.shadowBlur=16;x.beginPath();x.arc(mx,my,drawing?7:6,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.beginPath();x.arc(mx,my,2.2,0,7);x.fill()}
    if(cs.length)kick()};
  const kick=()=>{if(!raf2)raf2=requestAnimationFrame(loop)};
  const pt=e=>{const b=lzc.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top,t:performance.now()}};
  const toggleLz=()=>{lzOn=!lzOn;drawing=false;if(!lzOn)mx=-1;lzc.classList.toggle('on',lzOn);$('#lz').classList.toggle('on',lzOn);kick()};
  $('#lz').onclick=toggleLz;
  lzc.addEventListener('pointerdown',e=>{drawing=true;lzc.setPointerCapture(e.pointerId);const p=pt(e);mx=p.x;my=p.y;cs.push([p]);kick()},sg);
  lzc.addEventListener('pointermove',e=>{const p=pt(e);mx=p.x;my=p.y;if(drawing)cs[cs.length-1].push(p);kick()},sg);
  ['pointerup','pointercancel'].forEach(n=>lzc.addEventListener(n,()=>{drawing=false;kick()},sg));
  lzc.addEventListener('pointerleave',()=>{mx=-1;kick()},sg);
  addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
    if(k==='z'||k==='a'){e.preventDefault();const f=e.repeat?1.05:1.25;zoomTo(k==='z'?TZ*f:TZ/f,...zc())}
    else if(k==='l')toggleLz()},sg);
  addEventListener('resize',()=>{[fx,fy]=zc();apply(Z);fitLz()},sg);
  fitLz();
  // ----- halaman -----
  await loadWM();
  const paths=Array.from({length:d.pages},(_,i)=>`${d.id}/${String(i+1).padStart(3,'0')}.webp`);
  const s=await sb.storage.from(BUCKET).createSignedUrls(paths,90);
  if(s.error){close();toast('Akses ditolak. Kode mungkin sudah berakhir.');tick();return}
  const urls=(s.data||[]).map(x=>x.signedUrl);rs.innerHTML='';
  for(let i=0;i<d.pages;i++){
    const c=document.createElement('canvas');c.style.width=base()*Z+'px';rs.append(c);const x=c.getContext('2d');
    try{const bm=await createImageBitmap(await (await fetch(urls[i])).blob());c.width=bm.width;c.height=bm.height;x.drawImage(bm,0,0)}catch{c.width=820;c.height=200;x.fillText('Gagal memuat halaman',20,100)}
    mark(c)}}

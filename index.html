<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.json"><meta name="theme-color" content="#0b1f4d"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Dokumen ISO">
<title>Dokumen ISO | PT Karya Indah Multiguna</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f6fb;--card:#fff;--ink:#0f1f3d;--mut:#64748b;--line:#e2e8f0;--nav:#0b1f4d;--nav2:#13306b;--pri:#0a5bd6;--pri2:#3b8bff;--hero:#0a1a3f;--soft:#eaf1fd}
:root[data-t=dark]{--bg:#0a1228;--card:#111c3a;--ink:#e8eefc;--mut:#93a3c4;--line:#1f2f57;--soft:#14264d}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:'Plus Jakarta Sans','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button,input,select{font:inherit;color:inherit}
.side{position:fixed;inset:0 auto 0 0;width:250px;background:linear-gradient(180deg,var(--nav),#081638);color:#fff;display:flex;flex-direction:column;padding:26px 18px;z-index:5}
.brand{text-align:center;margin-bottom:26px}.brand b{display:block;font-family:Georgia,serif;font-size:40px;letter-spacing:3px;color:#fff}
.brand small{display:block;font-size:10px;letter-spacing:1.5px;color:#9db8ea}.brand span{display:block;margin-top:14px;font-size:12px;font-weight:700;letter-spacing:2px}
.nav{display:flex;flex-direction:column;gap:6px}
.nav button{display:flex;align-items:center;gap:14px;border:0;background:none;color:#cbd9f5;padding:13px 16px;border-radius:12px;font-weight:700;font-size:15px;cursor:pointer;text-align:left}
.nav button.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;box-shadow:0 6px 16px rgba(10,91,214,.4)}
.nav svg,.ib svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.motto{margin-top:auto;font-size:13px;line-height:1.6;color:#cbd9f5}.motto i{display:block;width:128px;height:2px;background:var(--pri2);margin-top:14px}
.main{margin-left:250px;padding:28px 32px 40px;min-height:100vh}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:22px}
.top h1{margin:0;font-size:25px;font-weight:800}.top p{margin:2px 0 0;color:var(--mut);font-size:13px}
.tr{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mut)}
.ib,.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:8px}
.ib{width:38px;height:38px;justify-content:center;color:var(--pri)}.chip{padding:5px 14px 5px 5px;font-weight:700;color:var(--ink)}
.av{width:30px;height:30px;border-radius:50%;background:var(--pri);color:#fff;display:grid;place-items:center;font-size:12px;font-weight:800}
.wrap{max-width:960px;margin:0 auto}
.hero{background:var(--hero);border-radius:28px;padding:30px 32px;color:#fff;position:relative;overflow:hidden;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:44px 44px}
.hero small{font-size:11px;font-weight:700;letter-spacing:1.4px;color:#7fb2ff}.hero h2{margin:10px 0 8px;font-size:32px;line-height:1.15;font-weight:800}
.hero p{margin:0 0 18px;font-size:13px;max-width:430px;line-height:1.5;color:#d6e2fb}
.hero ul{position:absolute;right:30px;bottom:26px;margin:0;padding:0;list-style:none;font-size:12px;line-height:26px}.hero li:before{content:'\2713';margin-right:8px;color:#7fb2ff}
.btn{border:0;background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;font-weight:800;padding:12px 20px;border-radius:12px;cursor:pointer;font-size:14px;box-shadow:0 6px 16px rgba(10,91,214,.35)}
.btn.g{background:var(--soft);color:var(--pri);box-shadow:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:12px 0}
.st{border-radius:20px;padding:16px 20px;position:relative;overflow:hidden}.st small{font-size:12px;color:var(--mut)}.st b{display:block;font-size:34px;font-weight:800;margin-top:2px}
.st:after{content:'';position:absolute;right:-18px;top:-22px;width:80px;height:80px;border-radius:50%;opacity:.5;background:currentColor}
.s1{background:#e8f0fe;color:#9db8f0}.s2{background:#e3f6f8;color:#9ad8e0}.s3{background:#ece9fd;color:#bcb2f2}
:root[data-t=dark] .s1{background:#13265a}:root[data-t=dark] .s2{background:#0f3340}:root[data-t=dark] .s3{background:#1f2060}
.st b,.st small{color:var(--ink)}.st small{color:var(--mut)}
.box{background:var(--card);border-radius:22px;padding:20px;border-top:3px solid var(--pri);box-shadow:0 8px 24px rgba(15,31,61,.06)}
.bh{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:12px;flex-wrap:wrap}.bh h3{margin:0;font-size:17px}.bh span{font-size:12px;color:var(--mut)}
.fl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.fl input,.fl select,.f input,.f select{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 14px;outline:none;min-width:0}.fl input{flex:1;min-width:180px}
.jf{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.jb{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 14px;font-weight:700;font-size:13px;cursor:pointer;display:inline-flex;gap:8px;align-items:center}
.jb i{font-style:normal;font-size:11px;background:var(--soft);color:var(--pri);border-radius:999px;padding:1px 8px}.jb.on{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff;border-color:transparent}.jb.on i{background:rgba(255,255,255,.25);color:#fff}
.grp{background:var(--soft);border-radius:12px;padding:9px 14px;font-weight:800;font-size:14px;margin:12px 0 8px;display:flex;justify-content:space-between}
.grp i{font-style:normal;background:var(--nav);color:#fff;border-radius:999px;font-size:12px;padding:1px 10px}
.it{display:flex;gap:14px;align-items:center;border:1px solid var(--line);border-left:4px solid var(--pri);border-radius:14px;padding:12px 14px;margin-bottom:8px;cursor:pointer;background:var(--card)}
.it:hover{border-color:var(--pri2)}.th{width:48px;height:58px;border-radius:8px;background:var(--soft);color:var(--pri);display:grid;place-items:center;flex:none;font-weight:800;font-size:11px}
.it b{font-size:14px}.it p{margin:2px 0 4px;font-size:12px;color:var(--mut)}
.tag{display:inline-block;background:var(--pri);color:#fff;font-size:11px;font-weight:800;padding:2px 10px;border-radius:999px;margin-right:6px}.tag.o{background:#e8f0fe;color:var(--pri)}
:root[data-t=dark] .tag.o{background:#1c3a7a;color:#bcd4ff}
.empty{text-align:center;color:var(--mut);padding:30px 10px;font-size:14px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--line)}th{color:var(--mut);font-weight:700}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}.f label{font-size:12px;font-weight:700;color:var(--mut);display:block}.f .w{grid-column:1/-1}.f input,.f select{width:100%;margin-top:4px}
.rd{position:fixed;inset:0;background:#0a1228;z-index:20;display:flex;flex-direction:column}
.rb{display:flex;align-items:center;gap:12px;padding:12px 18px;background:var(--nav);color:#fff}.rb b{font-size:14px;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs{flex:1;overflow:auto;padding:18px 10px 40px;display:flex;flex-direction:column;align-items:center;gap:14px}
.rs canvas{width:min(820px,100%);height:auto;background:#fff;border-radius:4px;box-shadow:0 8px 30px rgba(0,0,0,.5);pointer-events:none}
.rd.veil .rs{filter:blur(28px)}
.lg{position:fixed;inset:0;background:linear-gradient(160deg,var(--nav),#081638);display:grid;place-items:center;z-index:30;padding:20px}
.lc{background:var(--card);border-radius:24px;padding:30px;width:min(380px,100%)}.lc h2{margin:0 0 4px}.lc p{margin:0 0 16px;color:var(--mut);font-size:13px}.lc select{width:100%;margin-bottom:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.lc input{width:100%;margin-bottom:10px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:12px 14px}.lc .btn{width:100%;margin-top:4px}
.lk{background:none;border:0;color:var(--pri);font-weight:700;font-size:13px;cursor:pointer;padding:0}.lk:hover{text-decoration:underline}.lfr{text-align:center;margin-top:12px}.ok{color:#0a7a4b!important}
.err{color:#d6336c;font-size:12px;min-height:16px;margin-top:6px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--nav);color:#fff;padding:10px 18px;border-radius:999px;font-size:13px;z-index:40}
.pwr{position:relative}.pwr input{padding-right:46px}.eye{position:absolute;right:8px;top:6px;width:34px;height:34px;border:0;background:none;color:var(--mut);cursor:pointer;display:grid;place-items:center}
.eye svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.pa{width:84px;height:84px;border-radius:50%;background:var(--pri) center/cover;color:#fff;display:grid;place-items:center;font-size:26px;font-weight:800;flex:none}
.row{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:14px;padding:10px 14px;margin-bottom:8px;flex-wrap:wrap}.row b{font-size:14px}.row span{font-size:12px;color:var(--mut)}
.bs{padding:7px 12px;font-size:12px;border-radius:10px;box-shadow:none}.btn.r{background:#fde8ee;color:#c2255c;box-shadow:none}
.mdl{position:fixed;inset:0;background:rgba(5,12,30,.6);display:grid;place-items:center;z-index:35;padding:16px}.mdl .lc{width:min(440px,100%)}.mdl .btn{width:auto;margin:0}
.lc label{font-size:12px;font-weight:700;color:var(--mut);display:block;margin-bottom:4px}
@media(max-width:820px){
.side{inset:auto 0 0 0;width:auto;flex-direction:row;padding:8px 8px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #1d3a7a}
.brand,.motto{display:none}.nav{flex-direction:row;width:100%;justify-content:space-around}
.nav button{flex-direction:column;gap:3px;font-size:11px;padding:7px 10px;flex:1;align-items:center;border-radius:10px}
.main{margin-left:0;padding:calc(18px + env(safe-area-inset-top)) 16px 100px}
.hero{padding:22px}.hero h2{font-size:25px}.hero ul{display:none}.top h1{font-size:20px}.tr .d{display:none}
.stats{gap:8px}.st{padding:12px}.st b{font-size:26px}.f{grid-template-columns:1fr}
}
@media print{body{display:none!important}}
</style></head>
<body>
<div id="app"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
// ====== ISI DENGAN PROYEK SUPABASE ANDA (kosong = mode demo) ======
const SB_URL='https://jvrcmvazuhbxlktnzwer.supabase.co', SB_KEY='sb_publishable_De5UwPKibjXjQ2dFSbaAgw_jPMluQxS', BUCKET='iso-pages';
// ==================================================================
const demo=!SB_URL, sb=demo?null:(window.supabase?supabase.createClient(SB_URL,SB_KEY):null);
if(!demo&&!sb)document.addEventListener('DOMContentLoaded',()=>alert('Pustaka Supabase gagal dimuat. Periksa koneksi internet.'));
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const IC={home:'<path d="M3 11l9-8 9 8v9a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"/>',doc:'<path d="M6 3h9l4 4v14H6z"/><path d="M9 12h7M9 16h7"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',cog:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"/>',moon:'<path d="M20 14A8 8 0 0110 4a8 8 0 1010 10z"/>'};
const ic=n=>`<svg viewBox="0 0 24 24">${IC[n]}</svg>`;
const JENIS=[['MM','Manual Mutu'],['PR','Prosedur'],['IK','Instruksi Kerja'],['FM','Formulir'],['LN','Lainnya']];
const jOf=d=>{if(d.jenis&&JENIS.some(j=>j[0]===d.jenis))return d.jenis;const p=String(d.kode||'').split(/[-_ .]/)[0].toUpperCase();return ['MM','PR','IK','FM'].includes(p)?p:'LN'};
const jName=c=>(JENIS.find(j=>j[0]===c)||JENIS[4])[1];
const jOpts=sel=>JENIS.map(j=>`<option value="${j[0]}"${j[0]===sel?' selected':''}>${j[0]} - ${j[1]}</option>`).join('');
const sortDocs=a=>a.sort((x,y)=>JENIS.findIndex(j=>j[0]===jOf(x))-JENIS.findIndex(j=>j[0]===jOf(y))||String(x.kode).localeCompare(String(y.kode),'id',{numeric:true}));
let JF='';
let U=null, DOCS=[], LOG=[], V='home', Q='', DF='';
const DEMO_DOCS=[{id:'d1',kode:'MM-01',judul:'Manual Mutu',dept:'Semua',revisi:'Rev 03',pages:5},{id:'d2',kode:'SOP-GBJ-02',judul:'SOP Penerimaan dan Penyimpanan Barang Jadi',dept:'Gudang Barang Jadi',revisi:'Rev 01',pages:4},{id:'d3',kode:'IK-GBJ-05',judul:'Instruksi Kerja Produk Tidak Sesuai',dept:'Gudang Barang Jadi',revisi:'Rev 02',pages:3}];
const fmt=d=>new Date(d).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
const toast=m=>{const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)};

// ---------- data ----------
async function loadData(){
  if(demo){DOCS=sortDocs(DEMO_DOCS);return}
  const a=await sb.from('iso_documents').select('*').order('kode');DOCS=sortDocs(a.data||[]);
  const l=await sb.from('iso_access_log').select('*').order('at',{ascending:false}).limit(U.role==='admin'?200:50);LOG=l.data||[];
}
async function logAccess(d){
  const r={user_id:U.id,nama:U.nama,doc_id:d.id,judul:d.judul,at:new Date().toISOString()};
  if(demo){LOG.unshift(r);return}
  await sb.from('iso_access_log').insert(r);LOG.unshift(r);
}
// ---------- auth ----------
function loginView(){
  $('#app').innerHTML=`<div class="lg"><div class="lc"><h2>Dokumen ISO</h2><p>PT Karya Indah Multiguna. Masuk untuk membaca dokumen mutu.</p>
  ${demo?'<button class="btn" id="dm">Coba mode demo</button><p style="margin-top:12px">Belum terhubung ke Supabase. Isi SB_URL dan SB_KEY di file ini untuk memakai data asli.</p>':
  '<input id="em" type="email" placeholder="Email" autocomplete="username"><div class="pwr"><input id="pw" type="password" placeholder="Kata sandi" autocomplete="current-password"><button type="button" class="eye" id="ey" aria-label="Lihat kata sandi"><svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div><button class="btn" id="go">Masuk</button><div class="lfr"><button type="button" class="lk" id="fg">Lupa kata sandi?</button></div><div class="err" id="er"></div>'}</div></div>`;
  if(demo)$('#dm').onclick=()=>{U={id:'demo',nama:'Tamu Demo',dept:'Gudang Barang Jadi',role:'admin'};start()};
  else{const go=async()=>{const er=$('#er'),b=$('#go');er.textContent='';b.disabled=true;
    try{const {error}=await sb.auth.signInWithPassword({email:$('#em').value.trim(),password:$('#pw').value});
      if(error){const m=error.message||'';
        er.textContent=/invalid login/i.test(m)?'Email atau kata sandi salah, atau akun ini belum dibuat di Supabase.':/not confirmed/i.test(m)?'Email belum dikonfirmasi. Konfirmasi akun di dashboard Supabase (Authentication > Users).':'Gagal masuk: '+m;b.disabled=false;return}
      await boot()}catch(e){er.textContent='Gagal: '+(e.message||e);b.disabled=false}};
    $('#fg').onclick=()=>forgotView($('#em').value.trim());
    $('#go').onclick=go;$('#ey').onclick=()=>{const p=$('#pw'),h=p.type==='password';p.type=h?'text':'password';$('#ey').innerHTML=h?'<svg viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 6.1A9.6 9.6 0 0112 6c6 0 10 6 10 6a17 17 0 01-3.2 3.8M6.6 6.7A17 17 0 002 12s4 7 10 7a9.7 9.7 0 004.3-1"/></svg>':'<svg viewBox="0 0 24 24"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>'};['#em','#pw'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')go()}))}
};
async function sendReset(email){
  if(demo){toast('Mode demo: tidak berlaku');return false}
  const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:new URL('reset.html',location.href).href});
  if(error){const m=error.message||'';throw new Error(/rate limit|security purposes/i.test(m)?'Terlalu sering meminta. Tunggu sekitar satu menit lalu coba lagi.':m)}
  return true}
function forgotView(pre){
  $('#app').innerHTML=`<div class="lg"><div class="lc"><h2>Lupa kata sandi</h2><p>Masukkan email akun Anda. Kami kirim tautan untuk membuat kata sandi baru.</p>
  <input id="fe" type="email" placeholder="Email" autocomplete="username" value="${esc(pre||'')}"><button class="btn" id="fs">Kirim Tautan Reset</button>
  <div class="err" id="fm"></div><div class="lfr"><button type="button" class="lk" id="fb">Kembali ke halaman masuk</button></div></div></div>`;
  $('#fb').onclick=loginView;
  const send=async()=>{const m=$('#fm'),b=$('#fs'),e=$('#fe').value.trim();m.className='err';m.textContent='';
    if(!/^\S+@\S+\.\S+$/.test(e)){m.textContent='Masukkan alamat email yang valid.';return}
    b.disabled=true;
    try{await sendReset(e);m.className='err ok';m.textContent='Jika email terdaftar, tautan reset sudah dikirim. Cek kotak masuk dan folder spam.'}
    catch(x){m.textContent='Gagal: '+(x.message||x)}
    b.disabled=false};
  $('#fs').onclick=send;$('#fe').addEventListener('keydown',e=>{if(e.key==='Enter')send()})}
async function boot(){
  if(demo){loginView();return}
  const {data:{session}}=await sb.auth.getSession();if(!session){loginView();return}
  const p=await sb.from('iso_profiles').select('*').eq('id',session.user.id).single();
  U={id:session.user.id,email:session.user.email,nama:p.data?.nama||session.user.email,dept:p.data?.dept||'-',role:p.data?.role||'user',foto_at:p.data?.foto_at};await loadAv();
  try{await start();if(!p.data)toast('Profil belum dibuat di tabel profiles')}catch(e){loginView();$('#er').textContent='Gagal memuat data: '+(e.message||e)}
}
async function start(){await loadData();shell()}
// ---------- shell ----------
const NAV=[['home','Beranda','home'],['docs','Dokumen','doc'],['log','Riwayat','clock'],['adm','Kelola','cog']];
function shell(){
  const nav=NAV.filter(n=>n[0]!=='adm'||U.role==='admin').map(n=>`<button data-v="${n[0]}" class="${V===n[0]?'on':''}">${ic(n[2])}<span>${n[1]}</span></button>`).join('');
  const T={home:['Dokumen Mutu ISO','Baca dokumen resmi perusahaan dengan aman'],docs:['Daftar Dokumen','Cari dan buka dokumen sesuai hak akses Anda'],log:['Riwayat Akses','Catatan siapa membuka dokumen apa'],adm:['Kelola Dokumen','Unggah, ubah, ganti, atau hapus dokumen'],prof:['Profil Saya','Atur nama, foto, dan kata sandi']}[V];
  $('#app').innerHTML=`<aside class="side"><div class="brand"><b>KIM</b><small>PT KARYA INDAH MULTIGUNA</small><span>ISO WORKSPACE</span></div><nav class="nav">${nav}</nav><div class="motto">Dokumen Terkendali<br>Akses Tercatat<br>Mutu Terjaga<i></i></div></aside>
  <main class="main"><div class="top"><div><h1>${T[0]}</h1><p>${T[1]}</p></div><div class="tr"><span class="d">${new Date().toLocaleDateString('id-ID',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}</span><button class="ib" id="th" title="Tema">${ic('moon')}</button><button class="chip" id="me" title="Keluar"><span class="av"${U.av?` style="background:url(${U.av}) center/cover"`:''}>${U.av?'':esc(U.nama.slice(0,2).toUpperCase())}</span>${esc(U.nama.split(' ')[0])}</button></div></div><div class="wrap" id="v"></div></main>`;
  document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>{V=b.dataset.v;shell()});
  $('#th').onclick=()=>{const r=document.documentElement;r.dataset.t=r.dataset.t==='dark'?'':'dark'};
  $('#me').onclick=()=>{V='prof';shell()};
  ({home:vHome,docs:vDocs,log:vLog,adm:vAdm,prof:vProf})[V]();
}
const item=d=>`<div class="it" data-id="${d.id}"><div class="th">${jOf(d)}</div><div style="flex:1;min-width:0"><b>${esc(d.kode)} &middot; ${esc(d.judul)}</b><p>${d.pages} halaman &middot; ${esc(d.revisi||'')}</p><span class="tag">${esc(jName(jOf(d)))}</span><span class="tag">${esc(d.revisi||'Rev')}</span><span class="tag o">${esc(d.dept)}</span></div></div>`;
const bindItems=()=>document.querySelectorAll('.it').forEach(e=>e.onclick=()=>openDoc(DOCS.find(d=>d.id===e.dataset.id)));

  <div class="box"><div class="bh"><h3>Dokumen Terbaru</h3><button class="btn g" id="all">Lihat Semua</button></div>${DOCS.slice(0,4).map(item).join('')||'<div class="empty">Belum ada dokumen.</div>'}</div>`;
  $('#bd').onclick=$('#all').onclick=()=>{V='docs';shell()};bindItems();

function vLog(){
  const rows=(U.role==='admin'?LOG:LOG.filter(l=>l.user_id===U.id));

// ---------- admin ----------
const pth=(id,n)=>`${id}/${String(n).padStart(3,'0')}.webp`;
function modal(h,ok){const m=document.createElement('div');m.className='mdl';m.innerHTML=`<div class="lc">${h}<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px"><button class="btn g" id="mx">Batal</button><button class="btn" id="mo">Simpan</button></div></div>`;document.body.append(m);
  $('#mx').onclick=()=>m.remove();$('#mo').onclick=async()=>{try{await ok();m.remove()}catch(e){toast('Gagal: '+(e.message||e))}}}
async function pdfToPages(f,id,prog){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  for(let i=1;i<=pdf.numPages;i++){prog(`Halaman ${i} dari ${pdf.numPages}`);
    const p=await pdf.getPage(i),vp=p.getViewport({scale:1.6}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    const b=await new Promise(r=>c.toBlob(r,'image/webp',.78));
    const u=await sb.storage.from(BUCKET).upload(pth(id,i),b,{contentType:'image/webp',upsert:true});if(u.error)throw u.error}
  return pdf.numPages}
function vAdm(){
  $('#v').innerHTML=`<div class="box"><div class="bh"><h3>Unggah Dokumen Baru</h3><span id="pg">Dipecah menjadi gambar per halaman</span></div><div class="f">
  <div><label>Kode</label><input id="k" placeholder="SOP-GBJ-01"></div><div><label>Revisi</label><input id="r" placeholder="Rev 01"></div>
  <div class="w"><label>Judul</label><input id="j"></div><div><label>Jenis Dokumen</label><select id="jn">${jOpts('LN')}</select></div><div><label>Departemen</label><input id="dp" value="Semua"></div><div><label>File PDF</label><input id="fl" type="file" accept="application/pdf"></div>
  <div class="w"><button class="btn" id="up">Unggah dan Proses</button></div></div></div>
  <div class="box" style="margin-top:12px"><div class="bh"><h3>Dokumen Terunggah</h3><span>${DOCS.length} dokumen</span></div>${DOCS.map(d=>`<div class="row"><div style="min-width:0;flex:1"><b>${esc(d.kode)} &middot; ${esc(d.judul)}</b><br><span>${jOf(d)} &middot; ${d.pages} hal. &middot; ${esc(d.revisi||'-')} &middot; ${esc(d.dept)}</span></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn g bs" data-a="e" data-id="${d.id}">Ubah</button><button class="btn g bs" data-a="r" data-id="${d.id}">Ganti File</button><button class="btn r bs" data-a="x" data-id="${d.id}">Hapus</button></div></div>`).join('')||'<div class="empty">Belum ada dokumen.</div>'}</div><input type="file" id="rf" accept="application/pdf" hidden>`;
  let jTouched=false;$('#jn').onchange=()=>jTouched=true;
  $('#k').oninput=()=>{if(!jTouched)$('#jn').value=jOf({kode:$('#k').value})};
  const busy=m=>$('#pg').textContent=m, done=async m=>{toast(m);if(!demo)await loadData();shell()};
  $('#up').onclick=async()=>{
    const f=$('#fl').files[0],k=$('#k').value.trim(),j=$('#j').value.trim();if(!f||!k||!j){toast('Lengkapi kode, judul, dan file');return}
    if(demo){toast('Mode demo: unggah aktif setelah Supabase dihubungkan');return}
    $('#up').disabled=true;const id=crypto.randomUUID();
    try{const n=await pdfToPages(f,id,busy);
      const ins=await sb.from('iso_documents').insert({id,kode:k,judul:j,dept:$('#dp').value.trim()||'Semua',jenis:$('#jn').value,revisi:$('#r').value.trim(),pages:n});if(ins.error)throw ins.error;
      V='docs';await done('Dokumen berhasil diunggah')}catch(e){toast('Gagal: '+(e.message||e));$('#up').disabled=false}};
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,DOCS.find(d=>d.id===b.dataset.id)));
  async function act(a,d){
    if(a==='e')modal(`<h2>Ubah Dokumen</h2><p>Mengubah nama dan keterangan, bukan isi file.</p><label>Kode</label><input id="ek" value="${esc(d.kode)}"><label>Judul</label><input id="ej" value="${esc(d.judul)}"><label>Jenis Dokumen</label><select id="ejn">${jOpts(jOf(d))}</select><label>Departemen</label><input id="ed" value="${esc(d.dept)}"><label>Revisi</label><input id="er2" value="${esc(d.revisi||'')}">`,async()=>{
      const v={kode:$('#ek').value.trim(),judul:$('#ej').value.trim(),dept:$('#ed').value.trim()||'Semua',jenis:$('#ejn').value,revisi:$('#er2').value.trim()};if(!v.kode||!v.judul)throw new Error('Kode dan judul wajib diisi');
      if(demo)Object.assign(d,v);else{const r=await sb.from('iso_documents').update(v).eq('id',d.id);if(r.error)throw r.error}
      await done('Dokumen diubah')});
    if(a==='x'){if(!confirm(`Hapus "${d.kode}" beserta semua halamannya? Tindakan ini tidak bisa dibatalkan.`))return;
      try{if(demo)DOCS.splice(DOCS.indexOf(d),1);else{const r=await sb.storage.from(BUCKET).remove(Array.from({length:d.pages},(_,i)=>pth(d.id,i+1)));if(r.error)throw r.error;
        const x=await sb.from('iso_documents').delete().eq('id',d.id);if(x.error)throw x.error}
        await done('Dokumen dihapus')}catch(e){toast('Gagal: '+(e.message||e))}}
    if(a==='r'){if(demo){toast('Mode demo: ganti file aktif setelah Supabase dihubungkan');return}
      const rf=$('#rf');rf.value='';rf.onchange=async()=>{const f=rf.files[0];if(!f)return;
        const rv=prompt('Nomor revisi baru (kosongkan jika tidak berubah):',d.revisi||'');if(rv===null)return;
        try{const n=await pdfToPages(f,d.id,busy);
          if(n<d.pages)await sb.storage.from(BUCKET).remove(Array.from({length:d.pages-n},(_,i)=>pth(d.id,n+i+1)));
          const u=await sb.from('iso_documents').update({pages:n,...(rv.trim()?{revisi:rv.trim()}:{})}).eq('id',d.id);if(u.error)throw u.error;
          await done('File dokumen diganti')}catch(e){toast('Gagal: '+(e.message||e))}};rf.click()}
  }
}
// ---------- profil ----------
async function loadAv(){if(demo||!U.foto_at)return;const r=await sb.storage.from('iso-avatars').download(U.id+'.jpg');if(U.av)URL.revokeObjectURL(U.av);U.av=r.data?URL.createObjectURL(r.data):null}
async function squash(file){const bm=await createImageBitmap(file),m=Math.min(bm.width,bm.height),c=document.createElement('canvas');c.width=c.height=256;
  c.getContext('2d').drawImage(bm,(bm.width-m)/2,(bm.height-m)/2,m,m,0,0,256,256);
  for(let q=.8;;q-=.1){const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(b.size<=51200||q<.35)return b}}
function vProf(){
  $('#v').innerHTML=`<div class="box"><div class="bh"><h3>Profil</h3><span>${esc(U.dept)} &middot; ${U.role==='admin'?'Admin':'Pengguna'}</span></div>
  <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><div class="pa"${U.av?` style="background-image:url(${U.av})"`:''}>${U.av?'':esc(U.nama.slice(0,2).toUpperCase())}</div>
  <div><button class="btn g bs" id="pf">Ganti Foto</button> <button class="btn g bs" id="pd">Hapus Foto</button><p style="margin:6px 0 0;font-size:12px;color:var(--mut)">Foto dikecilkan otomatis menjadi di bawah 50 KB agar hemat penyimpanan.</p></div></div><input type="file" id="pi" accept="image/*" hidden>
  <div class="f"><div class="w"><label>Nama</label><input id="nm" value="${esc(U.nama)}"></div><div class="w"><button class="btn" id="sn">Simpan Nama</button></div></div></div>
  <div class="box" style="margin-top:12px"><div class="bh"><h3>Ganti Kata Sandi</h3></div><div class="f"><div><label>Kata sandi baru</label><input id="p1" type="password" autocomplete="new-password"></div><div><label>Ulangi kata sandi baru</label><input id="p2" type="password" autocomplete="new-password"></div>
  <div class="w"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="sp" style="width:auto;margin:0"> Tampilkan kata sandi</label></div><div class="w"><button class="btn" id="sg">Ganti Kata Sandi</button></div></div>
  <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)">Lupa kata sandi? Kami kirim tautan reset ke ${demo?'email Anda':'<b>'+esc(U.email||'')+'</b>'}.<div style="margin-top:8px"><button class="btn g bs" id="fr">Kirim Tautan Reset</button></div></div></div>
  <div style="margin-top:14px"><button class="btn r" id="lo">Keluar</button></div>`;
  $('#sp').onchange=e=>{$('#p1').type=$('#p2').type=e.target.checked?'text':'password'};
  $('#lo').onclick=async()=>{if(confirm('Keluar dari aplikasi?')){if(!demo)await sb.auth.signOut();if(U.av)URL.revokeObjectURL(U.av);U=null;V='home';loginView()}};
  $('#sn').onclick=async()=>{const n=$('#nm').value.trim();if(!n){toast('Nama tidak boleh kosong');return}
    if(!demo){const r=await sb.from('iso_profiles').update({nama:n}).eq('id',U.id).select();if(r.error||!r.data.length){toast('Gagal menyimpan nama (profil belum dibuat?)');return}}
    U.nama=n;toast('Nama disimpan');shell()};
  $('#sg').onclick=async()=>{const a=$('#p1').value;if(a.length<8){toast('Kata sandi minimal 8 karakter');return}if(a!==$('#p2').value){toast('Ulangi kata sandi dengan sama persis');return}
    if(demo){toast('Mode demo: tidak berlaku');return}const {error}=await sb.auth.updateUser({password:a});if(error){toast('Gagal: '+error.message);return}
    $('#p1').value=$('#p2').value='';toast('Kata sandi diganti')};
  $('#fr').onclick=async()=>{const b=$('#fr');b.disabled=true;
    try{if(await sendReset(U.email))toast('Tautan reset dikirim ke '+U.email)}catch(x){toast('Gagal: '+(x.message||x))}b.disabled=false};

    try{const b=await squash(f);
      if(!demo){const u=await sb.storage.from('iso-avatars').upload(U.id+'.jpg',b,{upsert:true,contentType:'image/jpeg',cacheControl:'60'});if(u.error)throw u.error;
        const t=new Date().toISOString(),r=await sb.from('iso_profiles').update({foto_at:t}).eq('id',U.id);if(r.error)throw r.error;U.foto_at=t}
      if(U.av)URL.revokeObjectURL(U.av);U.av=URL.createObjectURL(b);toast(`Foto disimpan (${Math.round(b.size/1024)} KB)`);shell()}catch(x){toast('Gagal: '+(x.message||x))}};
  $('#pd').onclick=async()=>{try{if(!demo){await sb.storage.from('iso-avatars').remove([U.id+'.jpg']);await sb.from('iso_profiles').update({foto_at:null}).eq('id',U.id)}
    if(U.av)URL.revokeObjectURL(U.av);U.av=null;U.foto_at=null;toast('Foto dihapus');shell()}catch(x){toast('Gagal: '+(x.message||x))}};
}
// ---------- reader ----------
function mark(c){const x=c.getContext('2d');x.save();x.globalAlpha=.16;x.fillStyle='#0a3a8a';x.font=`700 ${Math.round(c.width/34)}px sans-serif`;x.rotate(-0.5);
  const t=`${U.nama} \u2022 ${fmt(Date.now())}`;for(let y=-c.height;y<c.height*1.5;y+=c.width/6)for(let xx=-c.width;xx<c.width*1.5;xx+=c.width/1.6)x.fillText(t,xx+(y/(c.width/6)%2)*c.width/4,y);x.restore()}
async function openDoc(d){
  if(!d)return;const r=document.createElement('div');r.className='rd';
  r.innerHTML=`<div class="rb"><button class="btn g" id="cl">Tutup</button><b>${esc(d.kode)} &middot; ${esc(d.judul)}</b><span style="font-size:12px">${d.pages} hal.</span></div><div class="rs" id="rs"><div class="empty" style="color:#9db8ea">Memuat halaman...</div></div>`;
  document.body.append(r);$('#cl').onclick=()=>{r.remove();shell()};
  await logAccess(d);const rs=$('#rs');rs.innerHTML='';
  const paths=Array.from({length:d.pages},(_,i)=>`${d.id}/${String(i+1).padStart(3,'0')}.webp`);
  let urls=[];if(!demo){const s=await sb.storage.from(BUCKET).createSignedUrls(paths,90);urls=(s.data||[]).map(x=>x.signedUrl)}
  for(let i=0;i<d.pages;i++){
    const c=document.createElement('canvas');rs.append(c);const x=c.getContext('2d');
    if(demo){c.width=820;c.height=1160;x.fillStyle='#fff';x.fillRect(0,0,820,1160);x.fillStyle='#0b1f4d';x.font='700 30px sans-serif';x.fillText(d.kode,60,100);x.font='20px sans-serif';x.fillText(d.judul,60,140);
      x.fillStyle='#cbd5e1';for(let y=200;y<1050;y+=34)x.fillRect(60,y,700-(y%5)*30,10);x.fillStyle='#64748b';x.font='16px sans-serif';x.fillText(`Contoh halaman ${i+1} dari ${d.pages}`,60,1110)}
    else{try{const bm=await createImageBitmap(await (await fetch(urls[i])).blob());c.width=bm.width;c.height=bm.height;x.drawImage(bm,0,0)}catch{c.width=820;c.height=200;x.fillText('Gagal memuat halaman',20,100)}}
    mark(c);
  }
}
// ---------- penghalang (pencegah awam, bukan pengaman mutlak) ----------
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('dragstart',e=>e.preventDefault());
addEventListener('copy',e=>{if(!/INPUT/.test(e.target.tagName))e.preventDefault()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&['s','p','u','c','a'].includes(k)&&!/INPUT/.test(document.activeElement.tagName)||k==='f12'||k==='printscreen'){e.preventDefault();if(k==='printscreen'){navigator.clipboard?.writeText('');toast('Tangkapan layar dicatat sebagai pelanggaran kebijakan')}}});
const veil=on=>{const r=$('.rd');if(r)r.classList.toggle('veil',on)};
document.addEventListener('visibilitychange',()=>veil(document.hidden));addEventListener('blur',()=>veil(true));addEventListener('focus',()=>veil(false));
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script></body></html>

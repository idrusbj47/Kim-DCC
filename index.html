async function readText(f){
  const nm=f.name.toLowerCase(),out=[];
  if(nm.endsWith('.pdf')){
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    for(let i=1;i<=pdf.numPages;i++){const t=await(await pdf.getPage(i)).getTextContent();out.push({p:i,t:t.items.map(x=>x.str).join(' ')})}
  }else if(nm.endsWith('.docx')){
    const z=await JSZip.loadAsync(await f.arrayBuffer()),fx=z.file('word/document.xml');if(!fx)throw new Error('File Word tidak valid');
    const x=await fx.async('string');let n=0;
    x.split(/<w:lastRenderedPageBreak\/>|<w:br w:type="page"\/>/).forEach(seg=>{
      const t=seg.replace(/<\/w:p>/g,' ').replace(/<w:tab\/>/g,' ').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
      if(t.trim())out.push({p:++n,t})});
  }else throw new Error('Pilih file .pdf atau .docx');
  return out.map(o=>({p:o.p,t:o.t.replace(/\s+/g,' ').trim()})).filter(o=>o.t)}
async function indexText(id,f,np){
  const pg=await readText(f);
  if(!pg.length)throw new Error('File tidak berisi teks. Gunakan Word atau PDF hasil ekspor Word, bukan hasil scan.');
  let rows=pg;const last=Math.max(...pg.map(o=>o.p));
  if(last!==np){
    if(!confirm(`Jumlah halaman file teks (${last}) berbeda dengan dokumen (${np}), jadi nomor halaman bisa tidak cocok.\n\nOK = simpan tanpa nomor halaman (hasil pencarian membuka halaman 1)\nBatal = lewati indeks teks`))return false;
    rows=[{p:0,t:pg.map(o=>o.t).join(' ')}]}
  const d=await sb.from('iso_doc_text').delete().eq('doc_id',id);if(d.error)throw d.error;
  for(let i=0;i<rows.length;i+=40){const r=await sb.from('iso_doc_text').insert(rows.slice(i,i+40).map(o=>({doc_id:id,page:o.p,content:o.t})));if(r.error)throw r.error}
  return true}

      if(g.error){box.innerHTML='<div class="empty">Tabel akses dokumen belum siap. Jalankan ulang audit_setup.sql di Supabase.</div>';return}GR=g.data}
    CODES=CODES.filter(c=>new Date(c.expires_at)>Date.now());
    box.innerHTML=CODES.map(c=>{const pm=(c.mode||'semua')==='pilihan',n=GR.filter(x=>x.code_id===c.id).length;
      return `<div class="row"><div style="min-width:0;flex:1"><b class="cdl">${esc(c.code)}</b><br><span>${esc(c.label||'Tanpa keterangan')} &middot; sampai ${fmt(c.expires_at)} (${left(c.expires_at)})</span><br><span class="tag${pm?'':' o'}" style="margin-top:6px">${pm?`Dokumen pilihan &middot; ${n} dikirim`:'Semua dokumen'}</span></div><div style="display:flex;gap:6px"><button class="btn g bs" data-ca="${c.id}">Atur Akses</button><button class="btn r bs" data-cx="${c.id}">Cabut</button></div></div>`}).join('')||'<div class="empty">Belum ada kode aktif.</div>';
    document.querySelectorAll('[data-ca]').forEach(b=>b.onclick=()=>akses(CODES.find(c=>c.id===b.dataset.ca)));
    document.querySelectorAll('[data-cx]').forEach(b=>b.onclick=async()=>{if(!confirm('Cabut kode ini? Auditor yang sedang masuk langsung keluar.'))return;
      try{if(demo)CODES=CODES.filter(c=>c.id!==b.dataset.cx);else{const r=await sb.from('iso_audit_codes').delete().eq('id',b.dataset.cx);if(r.error)throw r.error}toast('Kode dicabut');loadCodes()}catch(x){toast('Gagal: '+(x.message||x))}})}
  function akses(c){if(!c)return;const cur=new Set(GR.filter(x=>x.code_id===c.id).map(x=>String(x.doc_id)));
    modal(`<h2>Atur Akses ${esc(c.code)}</h2><p>${esc(c.label||'Tanpa keterangan')}. Centang dokumen yang dikirim ke dasbor auditor. Perubahan langsung terlihat oleh auditor.</p>
    <label>Mode akses</label><select id="am"><option value="pilihan">Hanya dokumen yang dikirim admin</option><option value="semua">Semua dokumen</option></select>
    <div id="ap"><input id="as" placeholder="Cari dokumen"><div id="adl" style="max-height:300px;overflow:auto;margin-bottom:8px">${DOCS.map(d=>`<label class="ck" data-t="${esc((d.kode+' '+d.judul).toLowerCase())}"><input type="checkbox" value="${esc(d.id)}"${cur.has(String(d.id))?' checked':''}><span><b>${esc(d.kode)}</b> &middot; ${esc(d.judul)}<br><small>${jOf(d)} &middot; ${esc(d.revisi||'')}</small></span></label>`).join('')||'<div class="empty">Belum ada dokumen.</div>'}</div></div>`,
    async()=>{const mode=$('#am').value,sel=[...document.querySelectorAll('#adl input:checked')].map(i=>i.value);
      if(demo){c.mode=mode;GR=GR.filter(x=>x.code_id!==c.id).concat(sel.map(d=>({code_id:c.id,doc_id:d})))}
      else{const u=await sb.from('iso_audit_codes').update({mode}).eq('id',c.id);if(u.error)throw u.error;
        const add=sel.filter(d=>!cur.has(String(d))),rem=[...cur].filter(d=>!sel.includes(d));
        if(rem.length){const r=await sb.from('iso_audit_grants').delete().eq('code_id',c.id).in('doc_id',rem);if(r.error)throw r.error}
        if(add.length){const r=await sb.from('iso_audit_grants').insert(add.map(d=>({code_id:c.id,doc_id:d})));if(r.error)throw r.error}}
      toast('Akses auditor diperbarui');await loadCodes()});
    $('#am').value=c.mode||'semua';const sync=()=>$('#ap').style.display=$('#am').value==='pilihan'?'':'none';$('#am').onchange=sync;sync();
    $('#as').oninput=e=>{const q=e.target.value.toLowerCase();document.querySelectorAll('#adl .ck').forEach(l=>l.style.display=l.dataset.t.includes(q)?'':'none')}}
  $('#ck').oninput=e=>e.target.value=e.target.value.replace(/\D/g,'').slice(0,5);
  $('#cr').onclick=()=>$('#ck').value=String(crypto.getRandomValues(new Uint32Array(1))[0]%100000).padStart(5,'0');
  $('#cb').onclick=async()=>{const k=$('#ck').value.trim(),l=$('#cl').value.trim();if(!/^\d{5}$/.test(k)){toast('Kode harus 5 angka');return}
    try{if(demo)CODES.push({id:crypto.randomUUID(),code:k,label:l,mode:$('#cm').value,expires_at:new Date(Date.now()+864e5).toISOString()});
      else{await sb.from('iso_audit_codes').delete().eq('code',k).lte('expires_at',new Date().toISOString());
        const r=await sb.from('iso_audit_codes').insert({code:k,label:l||null,mode:$('#cm').value});if(r.error)throw new Error(r.error.code==='23505'?'Kode itu masih aktif. Pilih angka lain.':r.error.message)}
      $('#ck').value=$('#cl').value='';toast($('#cm').value==='pilihan'?'Kode dibuat. Tekan Atur Akses untuk memilih dokumen yang dikirim.':'Kode dibuat, berlaku 24 jam');loadCodes()}catch(x){toast('Gagal: '+(x.message||x))}};
  loadCodes();
  if(!demo)sb.from('iso_doc_text').select('doc_id').in('page',[0,1]).then(r=>{const k=new Set((r.data||[]).map(x=>String(x.doc_id)));document.querySelectorAll('[data-a=t]').forEach(b=>{if(k.has(b.dataset.id))b.textContent='Indeks Ulang'})});
  let jTouched=false;$('#jn').onchange=()=>jTouched=true;
  $('#k').oninput=()=>{if(!jTouched)$('#jn').value=jOf({kode:$('#k').value})};
  const busy=m=>$('#pg').textContent=m, done=async m=>{toast(m);if(!demo)await loadData();shell()};
  $('#up').onclick=async()=>{
    const f=$('#fl').files[0],k=$('#k').value.trim(),j=$('#j').value.trim();if(!f||!k||!j){toast('Lengkapi kode, judul, dan file');return}
    if(demo){toast('Mode demo: unggah aktif setelah Supabase dihubungkan');return}
    $('#up').disabled=true;const id=crypto.randomUUID();
    try{const n=await pdfToPages(f,id,busy);
      const ins=await sb.from('iso_documents').insert({id,kode:k,judul:j,dept:$('#dp').value.trim()||'Semua',jenis:$('#jn').value,revisi:$('#r').value.trim(),tgl_berlaku:$('#tb').value||null,pages:n});if(ins.error)throw ins.error;
      let m='Dokumen berhasil diunggah';const tf=$('#tf').files[0];
      if(tf)try{busy('Mengindeks teks...');m=(await indexText(id,tf,n))?'Dokumen diunggah dan teks diindeks':'Dokumen diunggah, indeks teks dilewati'}catch(x){m='Dokumen diunggah, tetapi teks gagal diindeks: '+(x.message||x)}
      V='docs';await done(m)}catch(e){toast('Gagal: '+(e.message||e));$('#up').disabled=false}};
  document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>act(b.dataset.a,DOCS.find(d=>d.id===b.dataset.id)));
  async function act(a,d){
    if(a==='e')modal(`<h2>Ubah Dokumen</h2><p>Mengubah nama dan keterangan, bukan isi file.</p><label>Kode</label><input id="ek" value="${esc(d.kode)}"><label>Judul</label><input id="ej" value="${esc(d.judul)}"><label>Jenis Dokumen</label><select id="ejn">${jOpts(jOf(d))}</select><label>Departemen</label><input id="ed" value="${esc(d.dept)}"><label>Revisi</label><input id="er2" value="${esc(d.revisi||'')}"><label>Tanggal Berlaku</label><input id="etb" type="date" value="${esc(String(d.tgl_berlaku||'').slice(0,10))}" onclick="this.showPicker&&this.showPicker()">`,async()=>{
      const v={kode:$('#ek').value.trim(),judul:$('#ej').value.trim(),dept:$('#ed').value.trim()||'Semua',jenis:$('#ejn').value,revisi:$('#er2').value.trim(),tgl_berlaku:$('#etb').value||null};if(!v.kode||!v.judul)throw new Error('Kode dan judul wajib diisi');
      if(demo)Object.assign(d,v);else{const r=await sb.from('iso_documents').update(v).eq('id',d.id);if(r.error)throw r.error}
      await done('Dokumen diubah')});
    if(a==='t'){if(demo){toast('Mode demo: aktif setelah Supabase dihubungkan');return}
      const i=document.createElement('input');i.type='file';i.accept='.pdf,.docx';
      i.onchange=async()=>{const f=i.files[0];if(!f)return;try{busy('Mengindeks teks...');const ok=await indexText(d.id,f,d.pages);await done(ok?'Teks diindeks':'Indeks teks dilewati')}catch(e){busy('Dipecah menjadi gambar per halaman');toast('Gagal: '+(e.message||e))}};i.click()}
    if(a==='x'){if(!confirm(`Hapus "${d.kode}" beserta semua halamannya? Tindakan ini tidak bisa dibatalkan.`))return;
      try{if(demo)DOCS.splice(DOCS.indexOf(d),1);else{const r=await sb.storage.from(BUCKET).remove(Array.from({length:d.pages},(_,i)=>pth(d.id,i+1)));if(r.error)throw r.error;
        const x=await sb.from('iso_documents').delete().eq('id',d.id);if(x.error)throw x.error;await sb.from('iso_doc_text').delete().eq('doc_id',d.id)}
        await done('Dokumen dihapus')}catch(e){toast('Gagal: '+(e.message||e))}}
    if(a==='r'){if(demo){toast('Mode demo: ganti file aktif setelah Supabase dihubungkan');return}
      const rf=$('#rf');rf.value='';rf.onchange=async()=>{const f=rf.files[0];if(!f)return;
        const rv=prompt('Nomor revisi baru (kosongkan jika tidak berubah):',d.revisi||'');if(rv===null)return;
        try{const n=await pdfToPages(f,d.id,busy);
          if(n<d.pages)await sb.storage.from(BUCKET).remove(Array.from({length:d.pages-n},(_,i)=>pth(d.id,n+i+1)));
          const u=await sb.from('iso_documents').update({pages:n,...(rv.trim()?{revisi:rv.trim()}:{})}).eq('id',d.id);if(u.error)throw u.error;
          await sb.from('iso_doc_text').delete().eq('doc_id',d.id);await done('File dokumen diganti. Indeks teks perlu dibuat ulang')}catch(e){toast('Gagal: '+(e.message||e))}};rf.click()}
  }
}
// ---------- profil ----------
async function loadAv(){if(demo||!U.foto_at)return;const r=await sb.storage.from('iso-avatars').download(U.id+'.jpg');if(U.av)URL.revokeObjectURL(U.av);U.av=r.data?URL.createObjectURL(r.data):null}
async function squash(file){const bm=await createImageBitmap(file),m=Math.min(bm.width,bm.height),c=document.createElement('canvas');c.width=c.height=256;
  c.getContext('2d').drawImage(bm,(bm.width-m)/2,(bm.height-m)/2,m,m,0,0,256,256);
  for(let q=.8;;q-=.1){const b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));if(b.size<=51200||q<.35)return b}}
function vProf(){
  $('#v').innerHTML=`<div class="box"><div class="bh"><h3>Profil</h3><span>${esc(U.dept)} &middot; ${U.role==='admin'?'Admin':'Pengguna'}</span></div>
  <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:14px"><div class="pa"${U.av?` style="background-image:url(${U.av})"`:''}>${U.av?'':esc(U.nama.slice(0,2).toUpperCase())}</div>
  <div><button class="btn g bs" id="pf">Ganti Foto</button> <button class="btn g bs" id="pd">Hapus Foto</button><p style="margin:6px 0 0;font-size:12px;color:var(--mut)">Foto dikecilkan otomatis menjadi di bawah 50 KB agar hemat penyimpanan.</p></div></div><input type="file" id="pi" accept="image/*" hidden>
  <div class="f"><div class="w"><label>Nama</label><input id="nm" value="${esc(U.nama)}"></div><div class="w"><button class="btn" id="sn">Simpan Nama</button></div></div></div>
  <div class="box" style="margin-top:12px"><div class="bh"><h3>Ganti Kata Sandi</h3></div><div class="f"><div><label>Kata sandi baru</label><input id="p1" type="password" autocomplete="new-password"></div><div><label>Ulangi kata sandi baru</label><input id="p2" type="password" autocomplete="new-password"></div>
  <div class="w"><label style="display:flex;gap:6px;align-items:center"><input type="checkbox" id="sp" style="width:auto;margin:0"> Tampilkan kata sandi</label></div><div class="w"><button class="btn" id="sg">Ganti Kata Sandi</button></div></div>
  <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)">Lupa kata sandi? Kami kirim tautan reset ke ${demo?'email Anda':'<b>'+esc(U.email||'')+'</b>'}.<div style="margin-top:8px"><button class="btn g bs" id="fr">Kirim Tautan Reset</button></div></div></div>
  <div style="margin-top:14px"><button class="btn r" id="lo">Keluar</button></div>`;
  $('#sp').onchange=e=>{$('#p1').type=$('#p2').type=e.target.checked?'text':'password'};
  $('#lo').onclick=async()=>{if(confirm('Keluar dari aplikasi?')){if(!demo)await sb.auth.signOut();if(U.av)URL.revokeObjectURL(U.av);U=null;V='home';gateView()}};
  $('#sn').onclick=async()=>{const n=$('#nm').value.trim();if(!n){toast('Nama tidak boleh kosong');return}
    if(!demo){const r=await sb.from('iso_profiles').update({nama:n}).eq('id',U.id).select();if(r.error||!r.data.length){toast('Gagal menyimpan nama (profil belum dibuat?)');return}}
    U.nama=n;toast('Nama disimpan');shell()};
  $('#sg').onclick=async()=>{const a=$('#p1').value;if(a.length<8){toast('Kata sandi minimal 8 karakter');return}if(a!==$('#p2').value){toast('Ulangi kata sandi dengan sama persis');return}
    if(demo){toast('Mode demo: tidak berlaku');return}const {error}=await sb.auth.updateUser({password:a});if(error){toast('Gagal: '+error.message);return}
    $('#p1').value=$('#p2').value='';toast('Kata sandi diganti')};
  $('#fr').onclick=async()=>{const b=$('#fr');b.disabled=true;
    try{if(await sendReset(U.email))toast('Tautan reset dikirim ke '+U.email)}catch(x){toast('Gagal: '+(x.message||x))}b.disabled=false};
  $('#pf').onclick=()=>$('#pi').click();
  $('#pi').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{const b=await squash(f);
      if(!demo){const u=await sb.storage.from('iso-avatars').upload(U.id+'.jpg',b,{upsert:true,contentType:'image/jpeg',cacheControl:'60'});if(u.error)throw u.error;
        const t=new Date().toISOString(),r=await sb.from('iso_profiles').update({foto_at:t}).eq('id',U.id);if(r.error)throw r.error;U.foto_at=t}
      if(U.av)URL.revokeObjectURL(U.av);U.av=URL.createObjectURL(b);toast(`Foto disimpan (${Math.round(b.size/1024)} KB)`);shell()}catch(x){toast('Gagal: '+(x.message||x))}};
  $('#pd').onclick=async()=>{try{if(!demo){await sb.storage.from('iso-avatars').remove([U.id+'.jpg']);await sb.from('iso_profiles').update({foto_at:null}).eq('id',U.id)}
    if(U.av)URL.revokeObjectURL(U.av);U.av=null;U.foto_at=null;toast('Foto dihapus');shell()}catch(x){toast('Gagal: '+(x.message||x))}};
}
// ---------- reader ----------
function mark(c){const x=c.getContext('2d');x.save();x.globalAlpha=.07;x.fillStyle='#0a3a8a';x.font=`700 ${Math.round(c.width/34)}px sans-serif`;x.rotate(-0.5);
  const t=`${U.nama} \u2022 ${fmt(Date.now())}`;for(let y=-c.height;y<c.height*1.5;y+=c.width/6)for(let xx=-c.width;xx<c.width*1.5;xx+=c.width/1.6)x.fillText(t,xx+(y/(c.width/6)%2)*c.width/4,y);x.restore()}
async function openDoc(d,pg){
  if(!d)return;const r=document.createElement('div');r.className='rd';
  r.innerHTML=`<div class="rb"><button class="btn g" id="cl">Tutup</button><b>${esc(d.kode)} &middot; ${esc(d.judul)}</b><span style="font-size:12px">${d.pages} hal.</span></div><div class="rs" id="rs"><div class="empty" style="color:#9db8ea">Memuat halaman...</div></div>`;
  document.body.append(r);$('#cl').onclick=()=>{r.remove();shell()};
  await logAccess(d);const rs=$('#rs');rs.innerHTML='';
  const paths=Array.from({length:d.pages},(_,i)=>`${d.id}/${String(i+1).padStart(3,'0')}.webp`);
  let urls=[];if(!demo){const s=await sb.storage.from(BUCKET).createSignedUrls(paths,90);urls=(s.data||[]).map(x=>x.signedUrl)}
  for(let i=0;i<d.pages;i++){
    const c=document.createElement('canvas');rs.append(c);const x=c.getContext('2d');
    if(demo){c.width=820;c.height=1160;x.fillStyle='#fff';x.fillRect(0,0,820,1160);x.fillStyle='#0b1f4d';x.font='700 30px sans-serif';x.fillText(d.kode,60,100);x.font='20px sans-serif';x.fillText(d.judul,60,140);
      x.fillStyle='#cbd5e1';for(let y=200;y<1050;y+=34)x.fillRect(60,y,700-(y%5)*30,10);x.fillStyle='#64748b';x.font='16px sans-serif';x.fillText(`Contoh halaman ${i+1} dari ${d.pages}`,60,1110)}
    else{try{const bm=await createImageBitmap(await (await fetch(urls[i])).blob());c.width=bm.width;c.height=bm.height;x.drawImage(bm,0,0)}catch{c.width=820;c.height=200;x.fillText('Gagal memuat halaman',20,100)}}
    mark(c);if(pg>1&&i===pg-1)c.scrollIntoView({block:'start'});
  }
}
// ---------- penghalang (pencegah awam, bukan pengaman mutlak) ----------
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('dragstart',e=>e.preventDefault());
addEventListener('copy',e=>{if(!/INPUT/.test(e.target.tagName))e.preventDefault()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&['s','p','u','c','a'].includes(k)&&!/INPUT/.test(document.activeElement.tagName)||k==='f12'||k==='printscreen'){e.preventDefault();if(k==='printscreen'){navigator.clipboard?.writeText('');toast('Tangkapan layar dicatat sebagai pelanggaran kebijakan')}}});
const veil=on=>{const r=$('.rd');if(r)r.classList.toggle('veil',on)};
document.addEventListener('visibilitychange',()=>veil(document.hidden));addEventListener('blur',()=>veil(true));addEventListener('focus',()=>veil(false));
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script></body></html>

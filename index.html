async function readText(f){
  const nm=f.name.toLowerCase(),out=[];
  if(nm.endsWith('.pdf')){
    pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
    for(let i=1;i<=pdf.numPages;i++){const t=await(await pdf.getPage(i)).getTextContent();out.push({p:i,t:t.items.map(x=>x.str).join(' ')})}
  }else if(nm.endsWith('.docx')){
    const z=await JSZip.loadAsync(await f.arrayBuffer()),fx=z.file('word/document.xml');if(!fx)throw new Error('File Word tidak valid');
    const x=await fx.async('string');let n=0;
    x.split(/<w:lastRenderedPageBreak\/>|<w:br w:type="page"\/>/).forEach(seg=>{
      const t=seg.replace(/<\/w:p>/g,' ').replace(/<w:tab\/>/g,' ').replace(/<[^>]+>/g,'').replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&apos;/g,"'").replace(/&amp;/g,'&');
      if(t.trim())out.push({p:++n,t})});
  }else throw new Error('Pilih file .pdf atau .docx');
  return out.map(o=>({p:o.p,t:o.t.replace(/\s+/g,' ').trim()})).filter(o=>o.t)}
async function indexText(id,f,np){
  const pg=await readText(f);
  if(!pg.length)throw new Error('File tidak berisi teks. Gunakan Word atau PDF hasil ekspor Word, bukan hasil scan.');
  let rows=pg;const last=Math.max(...pg.map(o=>o.p));
  if(last!==np){
    if(!confirm(`Jumlah halaman file teks (${last}) berbeda dengan dokumen (${np}), jadi nomor halaman bisa tidak cocok.\n\nOK = simpan tanpa nomor halaman (hasil pencarian membuka halaman 1)\nBatal = lewati indeks teks`))return false;
    rows=[{p:0,t:pg.map(o=>o.t).join(' ')}]}
  const d=await sb.from('iso_doc_text').delete().eq('doc_id',id);if(d.error)throw d.error;
  for(let i=0;i<rows.length;i+=40){const r=await sb.from('iso_doc_text').insert(rows.slice(i,i+40).map(o=>({doc_id:id,page:o.p,content:o.t})));if(r.error)throw r.error}
  return true}

async function pdfToPages(f,id,prog){
  pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
  const pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise;
  for(let i=1;i<=pdf.numPages;i++){prog(`Halaman ${i} dari ${pdf.numPages}`,(i-1)/pdf.numPages);
    const p=await pdf.getPage(i),vp=p.getViewport({scale:1.6}),c=document.createElement('canvas');c.width=vp.width;c.height=vp.height;
    await p.render({canvasContext:c.getContext('2d'),viewport:vp}).promise;
    const b=await new Promise(r=>c.toBlob(r,'image/webp',.78));
    const u=await sb.storage.from(BUCKET).upload(pth(id,i),b,{contentType:'image/webp',upsert:true});if(u.error)throw u.error;prog(`Halaman ${i} dari ${pdf.numPages}`,i/pdf.numPages)}
  return pdf.numPages}

  <div style="margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-size:13px;color:var(--mut)">Lupa kata sandi? Kami kirim tautan reset ke ${demo?'email Anda':'<b>'+esc(U.email||'')+'</b>'}.<div style="margin-top:8px"><button class="btn g bs" id="fr">Kirim Tautan Reset</button></div></div></div>
  <div style="margin-top:14px"><button class="btn r" id="lo">Keluar</button></div>`;
  bindDeptBox();
  $('#sp').onchange=e=>{$('#p1').type=$('#p2').type=e.target.checked?'text':'password'};
  $('#lo').onclick=async()=>{if(confirm('Keluar dari aplikasi?')){clearInterval(TMR);if(!demo)await sb.auth.signOut();if(U.av)URL.revokeObjectURL(U.av);U=null;V='home';HON=false;gateView()}};
  $('#sn').onclick=async()=>{const n=$('#nm').value.trim();if(!n){toast('Nama tidak boleh kosong');return}
    if(!demo){const r=await sb.from('iso_profiles').update({nama:n}).eq('id',U.id).select();if(r.error||!r.data.length){toast('Gagal menyimpan nama (profil belum dibuat?)');return}}
    U.nama=n;succ('Nama disimpan');shell()};
  $('#sg').onclick=async()=>{const a=$('#p1').value;if(a.length<8){toast('Kata sandi minimal 8 karakter');return}if(a!==$('#p2').value){toast('Ulangi kata sandi dengan sama persis');return}
    if(demo){toast('Mode demo: tidak berlaku');return}const {error}=await sb.auth.updateUser({password:a});if(error){toast('Gagal: '+error.message);return}
    $('#p1').value=$('#p2').value='';succ('Kata sandi diganti')};
  cdBind($('#fr'),'reset-profil','Kirim Tautan Reset');
  $('#fr').onclick=async()=>{const b=$('#fr');if(cdGet('reset-profil')>Date.now())return;b.disabled=true;
    try{if(await sendReset(U.email)){succ('Tautan reset terkirim');cdSet('reset-profil',60)}}catch(x){toast('Gagal: '+(x.message||x))}cdBind(b,'reset-profil','Kirim Tautan Reset')};
  $('#pf').onclick=()=>$('#pi').click();
  $('#pi').onchange=async e=>{const f=e.target.files[0];if(!f)return;
    try{const b=await squash(f);
      if(!demo){const u=await sb.storage.from('iso-avatars').upload(U.id+'.jpg',b,{upsert:true,contentType:'image/jpeg',cacheControl:'60'});if(u.error)throw u.error;
        const t=new Date().toISOString(),r=await sb.from('iso_profiles').update({foto_at:t}).eq('id',U.id);if(r.error)throw r.error;U.foto_at=t}
      if(U.av)URL.revokeObjectURL(U.av);U.av=URL.createObjectURL(b);succ(`Foto disimpan (${Math.round(b.size/1024)} KB)`);shell()}catch(x){toast('Gagal: '+(x.message||x))}};
  $('#pd').onclick=async()=>{try{if(!demo){await sb.storage.from('iso-avatars').remove([U.id+'.jpg']);await sb.from('iso_profiles').update({foto_at:null}).eq('id',U.id)}
    if(U.av)URL.revokeObjectURL(U.av);U.av=null;U.foto_at=null;succ('Foto dihapus');shell()}catch(x){toast('Gagal: '+(x.message||x))}};
}
// ---------- reader ----------
function mark(c,o=WM,name,when){const x=c.getContext('2d');x.save();x.globalAlpha=o.opacity;x.fillStyle=x.strokeStyle='#0a3a8a';x.font=`700 ${Math.round(c.width/34)}px sans-serif`;x.rotate(-0.5);
  x.lineJoin='round';x.lineWidth=o.thickness*c.width/2500;
  const t=`${name??U.nama} \u2022 ${fmt(when??Date.now())}`,put=(a,b)=>{x.fillText(t,a,b);if(o.thickness>0)x.strokeText(t,a,b)};
  for(let y=-c.height;y<c.height*1.5;y+=c.width/6)for(let xx=-c.width;xx<c.width*1.5;xx+=c.width/1.6)put(xx+(y/(c.width/6)%2)*c.width/4,y);x.restore()}
async function openDoc(d,pg){
  if(!d)return;const r=document.createElement('div');r.className='rd';
  r.innerHTML=`<div class="rb"><button class="btn g" id="cl">Tutup</button><b>${esc(d.kode)} &middot; ${esc(d.judul)}${bgOf(d)?' &middot; '+esc(d.dept)+' &rsaquo; '+esc(bgOf(d)):''}</b><span class="zc"><button class="zb" id="zo" title="Perkecil (A)">&minus;</button><span class="zl" id="zp">100%</span><button class="zb" id="zi" title="Perbesar (Z)">+</button><button class="zb" id="lz" title="Laser / pointer (L)">Laser</button></span><span class="pgs" style="font-size:12px">${d.pages} hal.</span></div><div class="rs" id="rs"><div class="empty" style="color:#9db8ea">Memuat halaman...</div></div><canvas class="lz" id="lzc"></canvas>`;
  document.body.append(r);
  const rs=$('#rs'),zp=$('#zp'),lzc=$('#lzc'),ac=new AbortController(),sg={signal:ac.signal};
  let Z=1,TZ=1,fx=0,fy=0,raf=0,raf2=0,cs=[],lzOn=false,drawing=false,mx=-1,my=-1;
  const MINZ=.5,MAXZ=4,LT=5000;
  const close=()=>{ac.abort();cancelAnimationFrame(raf);cancelAnimationFrame(raf2);r.remove();shell()};
  $('#cl').onclick=close;r._close=close;
  // ----- zoom halus (tombol Z / A, Ctrl + scroll, tombol + / -) -----
  const base=()=>Math.max(200,Math.min(820,rs.clientWidth-20));
  const apply=nz=>{const sh=rs.scrollHeight,sw=rs.scrollWidth,sx=rs.scrollLeft+fx,sy=rs.scrollTop+fy,w=base()*nz+'px';
    rs.querySelectorAll('canvas').forEach(c=>c.style.width=w);Z=nz;
    rs.scrollLeft=sx*(rs.scrollWidth/sw)-fx;rs.scrollTop=sy*(rs.scrollHeight/sh)-fy;zp.textContent=Math.round(nz*100)+'%'};
  const tick=()=>{raf=0;const df=TZ-Z;if(Math.abs(df)<.002){apply(TZ);return}apply(Z+df*.2);raf=requestAnimationFrame(tick)};
  const zoomTo=(t,x,y)=>{TZ=Math.max(MINZ,Math.min(MAXZ,t));fx=x;fy=y;if(!raf)raf=requestAnimationFrame(tick)};
  const zc=()=>[rs.clientWidth/2,rs.clientHeight/2];
  $('#zi').onclick=()=>zoomTo(TZ*1.25,...zc());$('#zo').onclick=()=>zoomTo(TZ/1.25,...zc());
  r.addEventListener('wheel',e=>{
    if(e.ctrlKey||e.metaKey){e.preventDefault();const b=rs.getBoundingClientRect(),k=Math.abs(e.deltaY)<50?.01:.0022;zoomTo(TZ*Math.exp(-e.deltaY*k),e.clientX-b.left,e.clientY-b.top)}
    else if(e.target===lzc){e.preventDefault();rs.scrollBy(e.deltaX,e.deltaY)}},{passive:false,signal:ac.signal});
  // ----- laser / pointer: coretan hilang dalam 5 detik -----
  const fitLz=()=>{const t=$('.rb').offsetHeight,w=r.clientWidth,h=r.clientHeight-t,s=devicePixelRatio||1;
    lzc.style.top=t+'px';lzc.style.width=w+'px';lzc.style.height=h+'px';lzc.width=w*s;lzc.height=h*s;kick()};
  const loop=()=>{raf2=0;const x=lzc.getContext('2d'),s=devicePixelRatio||1,now=performance.now();
    x.setTransform(s,0,0,s,0,0);x.clearRect(0,0,lzc.width,lzc.height);x.lineCap=x.lineJoin='round';
    cs=cs.map(st=>st.filter(p=>now-p.t<LT)).filter(st=>st.length);
    x.shadowColor='#ff2a2a';x.shadowBlur=10;x.strokeStyle=x.fillStyle='#ff2a2a';x.lineWidth=4;
    for(const st of cs){
      if(st.length===1){x.globalAlpha=Math.max(0,1-(now-st[0].t)/LT);x.beginPath();x.arc(st[0].x,st[0].y,2.5,0,7);x.fill()}
      for(let i=1;i<st.length;i++){x.globalAlpha=Math.max(0,1-(now-st[i].t)/LT);x.beginPath();x.moveTo(st[i-1].x,st[i-1].y);x.lineTo(st[i].x,st[i].y);x.stroke()}}
    if(lzOn&&mx>=0){x.globalAlpha=1;x.shadowBlur=16;x.beginPath();x.arc(mx,my,drawing?7:6,0,7);x.fill();x.shadowBlur=0;x.fillStyle='#fff';x.beginPath();x.arc(mx,my,2.2,0,7);x.fill()}
    if(cs.length)kick()};
  const kick=()=>{if(!raf2)raf2=requestAnimationFrame(loop)};
  const pt=e=>{const b=lzc.getBoundingClientRect();return{x:e.clientX-b.left,y:e.clientY-b.top,t:performance.now()}};
  const toggleLz=()=>{lzOn=!lzOn;drawing=false;if(!lzOn)mx=-1;lzc.classList.toggle('on',lzOn);$('#lz').classList.toggle('on',lzOn);kick()};
  $('#lz').onclick=toggleLz;
  lzc.addEventListener('pointerdown',e=>{drawing=true;lzc.setPointerCapture(e.pointerId);const p=pt(e);mx=p.x;my=p.y;cs.push([p]);kick()},sg);
  lzc.addEventListener('pointermove',e=>{const p=pt(e);mx=p.x;my=p.y;if(drawing)cs[cs.length-1].push(p);kick()},sg);
  ['pointerup','pointercancel'].forEach(n=>lzc.addEventListener(n,()=>{drawing=false;kick()},sg));
  lzc.addEventListener('pointerleave',()=>{mx=-1;kick()},sg);
  addEventListener('keydown',e=>{if(e.ctrlKey||e.metaKey||e.altKey)return;const k=e.key.toLowerCase();
    if(k==='z'||k==='a'){e.preventDefault();const f=e.repeat?1.05:1.25;zoomTo(k==='z'?TZ*f:TZ/f,...zc())}
    else if(k==='l')toggleLz()},sg);
  addEventListener('resize',()=>{[fx,fy]=zc();apply(Z);fitLz()},sg);
  fitLz();
  // ----- halaman -----
  await logAccess(d);await loadWM();rs.innerHTML='';
  const paths=Array.from({length:d.pages},(_,i)=>`${d.id}/${String(i+1).padStart(3,'0')}.webp`);
  let urls=[];if(!demo){const s=await sb.storage.from(BUCKET).createSignedUrls(paths,90);urls=(s.data||[]).map(x=>x.signedUrl)}
  for(let i=0;i<d.pages;i++){
    const c=document.createElement('canvas');c.style.width=base()*Z+'px';rs.append(c);const x=c.getContext('2d');
    if(demo){c.width=820;c.height=1160;x.fillStyle='#fff';x.fillRect(0,0,820,1160);x.fillStyle='#0b1f4d';x.font='700 30px sans-serif';x.fillText(d.kode,60,100);x.font='20px sans-serif';x.fillText(d.judul,60,140);
      x.fillStyle='#cbd5e1';for(let y=200;y<1050;y+=34)x.fillRect(60,y,700-(y%5)*30,10);x.fillStyle='#64748b';x.font='16px sans-serif';x.fillText(`Contoh halaman ${i+1} dari ${d.pages}`,60,1110)}
    else{try{const bm=await createImageBitmap(await (await fetch(urls[i])).blob());c.width=bm.width;c.height=bm.height;x.drawImage(bm,0,0)}catch{c.width=820;c.height=200;x.fillText('Gagal memuat halaman',20,100)}}
    mark(c);if(pg>1&&i===pg-1)c.scrollIntoView({block:'start'});
  }
}
// ---------- penghalang (pencegah awam, bukan pengaman mutlak) ----------
addEventListener('contextmenu',e=>e.preventDefault());
addEventListener('dragstart',e=>e.preventDefault());
addEventListener('copy',e=>{if(!/INPUT/.test(e.target.tagName))e.preventDefault()});
addEventListener('keydown',e=>{const k=e.key.toLowerCase();
  if((e.ctrlKey||e.metaKey)&&['s','p','u','c','a'].includes(k)&&!/INPUT/.test(document.activeElement.tagName)||k==='f12'||k==='printscreen'){e.preventDefault();if(k==='printscreen'){navigator.clipboard?.writeText('');toast('Tangkapan layar dicatat sebagai pelanggaran kebijakan')}}});
const veil=on=>{const r=$('.rd');if(r)r.classList.toggle('veil',on)};
document.addEventListener('visibilitychange',()=>veil(document.hidden));addEventListener('blur',()=>veil(true));addEventListener('focus',()=>veil(false));
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
boot();
</script></body></html>
